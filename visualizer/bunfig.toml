[test]
# DF4.2 coverage gate. Scoped to visualizer/ (this file only resolves for
# runs whose cwd is visualizer/) so the root `bun test` — which also picks up
# visualizer/test/*.test.ts via the root glob — inherits NO threshold here.
coverage = true
coverageReporter = ["text", "lcov"]

# Bun's object-form threshold gates per-metric, checked against the
# aggregate "All files" row. Measured empirically on bun 1.3.13:
# `function`/`func`/`statements`/`branches` etc. are silently ignored,
# matching upstream docs.
#
# `functions` (plural) is documented as the effective key but is BROKEN in
# this bun build: `coverageThreshold = { functions = <any value> }` exits
# nonzero unconditionally, independent of the actual measured percentage —
# confirmed by sweeping 0.01/0.10/0.50/0.90/50 (percent form) against a run
# where the aggregate clears 96%+ functions every time. `line` does not
# have this problem: swept the same way, it gates correctly against the
# aggregate. So `functions` is deliberately OMITTED here — including it
# would fail every run, covered or not, which is not a gate, it's a
# permanent red X. The function floor (and, per-file, the line floor too —
# this key only sees the aggregate) is enforced by check-lcov.ts instead,
# as its own CI step (see check-lcov.test.ts case (c) for the function
# regression and case (a) for the per-file line regression).
#
# 90% lines matches the existing repo convention (see the untouched line
# floor elsewhere). The aggregate clears it today (94.94%) even though
# server/index.ts individually sits at 83.19% — this key can't see that,
# which is exactly why check-lcov.ts's per-file check exists.
# MEASURED on bun 1.3.13 against this project, not taken from docs:
#   coverageThreshold = 0.90            -> ENFORCES (0.999 and 1.0 both exit 1)
#   coverageThreshold = { line = ... }  -> SILENTLY IGNORED at every value, incl. 1.0
#   coverageThreshold = { functions = ...} -> exits 1 unconditionally, even at 0
#   [test.coverageThreshold] (nested)   -> silently ignored
# So the bare number is the ONLY working form here. It gates lines AND functions
# (whichever is lower), which is what we want: a file whose functions are never
# invoked cannot hide behind bun's line accounting, where DA: lands on the
# declaration line. Per-file floors are NOT expressible here at all — that is
# scripts/check-lcov.ts's job, run as its own CI step after this one.
coverageThreshold = 0.90
# F083 CROSS-REFERENCE, 2026-08-28: a sweep run for the new root-scope gate
# (bunfig.coverage.toml) measured the bare number ALSO enforced PER FILE on
# min(% funcs, % lines), not just against the "All files" aggregate the
# comment above measured — a run at 45.27%/48.99% aggregate still exited 1 at
# a threshold of 0.01 because individual files sat at 0.00%. These are not
# alternative behaviors to pick between: upstream (bun PR #27933) enforces the
# bare-number threshold against BOTH the aggregate AND each file, so either
# measurement failing is enough to redden a run. This gate is green today
# either way, so nothing is changed here.

coveragePathIgnorePatterns = [
  # Test fixtures aren't product code; excluding a bare "test" would also
  # match nothing (patterns must be path- or **-anchored, not basenames).
  "test/**",
  # deploy.test.ts imports src/providers/**, which drags eleven out-of-tree
  # files into the run and crashed the aggregate from 99.86% to 68.17% —
  # silently, because the object-form threshold was inert. DF1.4/DF2.x own
  # their own coverage; this gate is visualizer-scoped.
  "../src/**",
  "../tests/**",

  # DF1.4's tracer/schema/migrations/pragmas/types enter this run only
  # because test/fixtures/trace-fixture.ts imports them for the auth/routes
  # tests. DF1.4 owns its own coverage gate; this one is scoped to the
  # visualizer (server/** + src/lib/**) and shouldn't be dragged down (or
  # padded up) by a dependency's numbers.
  "../src/phase-engine/**",

  # F073 DECISION (not an oversight): the ~2,700 LOC of .vue components below
  # stay OUT of this gate on purpose. A DOM harness (@vue/test-utils + happy-dom)
  # to cover them is a whole test stack for template glue; the logic worth
  # testing is being EXTRACTED instead — tasks 5.5 and 5.6 move the polling and
  # drain logic into visualizer/src/lib/**, which this gate already covers with
  # no config change. What remains in the components after that is markup and
  # bindings, gated by build:check (vue-tsc + vite build) and by the API-contract
  # suite. Revisit only if a component regression ships that build:check could
  # not have caught.
  #
  # bun has no .vue loader — none of these ever produce an SF: record today,
  # so excluding them changes no number now. They're listed anyway so the
  # day a DOM test harness (e.g. @vue/test-utils) starts loading .vue files,
  # the exclusion is a deliberate line someone has to un-comment rather than
  # a silent widening of the gate. The real component gate today is
  # build:check (vue-tsc + vite build) plus the API-contract test suite.
  "src/App.vue",
  "src/components/SessionsList.vue",
  "src/components/SessionCard.vue",
  "src/components/SessionTrace.vue",
  "src/components/PhaseDetail.vue",
  "src/components/DetailSection.vue",
  "src/components/PhaseDots.vue",
  "src/components/StatChip.vue",
  "src/components/StatusChip.vue",

  # check-lcov.test.ts imports check-lcov.ts, so it gets instrumented too.
  # It's tooling for the gate, not shipped app code, and it isn't a member
  # of the server/** or src/lib/** globs check-lcov.ts itself enforces —
  # ignoring it here keeps both gates agreeing on what's in scope.
  "scripts/**",
]
