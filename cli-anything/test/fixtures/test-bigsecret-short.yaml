name: big-secret-short-prefix
command: sh
args:
  - "-c"
  # 262140 A's + 18-char secret => only 4 chars of the secret survive the
  # 262144 cap (< the 8-char minimum): intentionally NOT redacted, and the
  # benign output must not be sprayed with [REDACTED:...] markers.
  - 'head -c 262140 /dev/zero | tr "\0" A; printf "%s" "$MY_SECRET_TOKEN"'
