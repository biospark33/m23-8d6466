name: redact-recap
command: sh
args:
  - "-c"
  # Exactly MAX_STDOUT_EXCERPT bytes of output ending in the full secret:
  # not truncated, but replacing the 18-char secret with the longer
  # "[REDACTED:MY_SECRET_TOKEN]" marker pushes the excerpt past the cap,
  # so the cap must be re-applied after redaction.
  - 'head -c 262126 /dev/zero | tr "\0" A; printf "%s" "$MY_SECRET_TOKEN"'
