name: big-secret-leak
command: sh
args:
  - "-c"
  # 262114 A's + 35-char secret => 30 chars of the secret survive the
  # 262144 cap (>= the 8-char minimum boundary-prefix length, so they must
  # be redacted at the cut), and the 26-char "[REDACTED:...]" marker still
  # fits under the post-redaction re-cap (262114 + 26 <= 262144).
  - 'head -c 262114 /dev/zero | tr "\0" A; printf "%s" "$MY_SECRET_TOKEN"'
