  - id: SPL-030
    category: tooling-hygiene
    pattern: "Never cd in compound Bash calls during orchestration; absolute paths only"
    description: |
      A `cd <dir> && ...` in one Bash call persists the cwd into later
      calls. Mid-campaign this made relative-path checks report the story
      directory missing and all review verdicts absent -- a false alarm
      that cost several turns and nearly triggered misdiagnosis of the
      review wave. Orchestrator Bash calls use absolute paths exclusively;
      if a cd is unavoidable, append `; cd -` or reset cwd in the same
      call.
    evidence:
      session: "2026-08-12 DF-v5 backlog derivation"
      finding: "ls _bmad-output/... from inside the stories dir returned 'No such file or directory' while 6 verdict files sat at the absolute path"
    first_seen: "2026-08-12"
    times_seen: 1
    applications: 0
    confidence: "low"
