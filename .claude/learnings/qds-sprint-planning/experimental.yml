learnings:
  - id: SPL-023
    category: phase-3-commit-tooling
    pattern: "Use git commit -F <tmpfile> as a robust alternative for sprint-planning commits"
    description: |
      CORRECTION (2026-05-16): The original write-up incorrectly blamed
      apostrophes in story IDs (B3', B4') for breaking the heredoc commit
      pattern. This was wrong: `<<'EOF'` (quoted heredoc delimiter) DOES
      preserve apostrophes in the body without issue — confirmed by shell
      test, exit 0, content intact. The `git commit -m "$(cat <<'EOF'
      ... EOF)"` pattern is safe for apostrophe-containing messages.

      The true root cause of the Phase-3 commit failure in the 2026-05-16
      session is UNKNOWN (single observation; no definitive evidence).

      Recommendation (robustness/best-practice, not a bug workaround):
      Write the commit message to a temp file outside the repo (e.g.
      /tmp/commit_msg.txt) and commit with `git commit -F /tmp/commit_msg.txt`.
      This avoids all shell-quoting complexity — including multi-line
      messages, special characters, and heredoc edge cases — and is
      unambiguously safe. Both `<<'EOF'` and `git commit -F <file>`
      remain valid options; the -F pattern is simply more resilient.
      Per git safety: after any failed commit attempt, create a NEW commit
      (never --amend).
    evidence:
      session: "2026-05-16 qds-sprint-planning for Epic PRO-HUB"
      user_feedback: |
        Phase-3 commit failed once; recovered by writing the message to
        /tmp and using `git commit -F`. Original diagnosis (apostrophes
        breaking <<'EOF') was incorrect — <<'EOF' handles apostrophes
        correctly. True root cause unknown. Single observation.
