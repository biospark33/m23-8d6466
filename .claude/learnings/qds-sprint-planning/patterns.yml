  # ============================================================================
  # B8 SPRINT PLANNING LEARNINGS (2026-02-09)
  # Pattern application enforcement failure
  # ============================================================================

  - id: SPL-013
    category: agent-allocation-enforcement
    pattern: "Pre-flight check: Verify agent allocation BEFORE spawning writing agents"
    related_patterns: [SPL-001]  # Enforces the max 2 stories per agent rule
    description: |
      CRITICAL: Before spawning any writing agents in Phase 2, run a pre-flight check
      to verify that no agent will be assigned more than 2 stories.

      Enforcement algorithm:
      1. Count total stories to write: N
      2. Calculate minimum agents needed: agents = ceil(N / 2)
      3. Group stories by wave/batch strategy
      4. Assign max 2 stories per agent
      5. If any agent would exceed 2, spawn additional agents

      Example: 5 stories require 3 agents (2+2+1 or 2+1+2 depending on wave strategy)
    evidence:
      session: "2026-02-09 qds-sprint-planning for Epic B8"
      user_feedback: "i noticed that it used a single subagent to write 3 stories
      instead of max 2"
      violation: "Single agent assigned B8.3a, B8.3b, B8.3c (3 stories)
      when max should be 2 per agent"
      correct_allocation: "Agent 1: B8.3a + B8.3b (2 stories), Agent 2: B8.3c (1 story)
      OR Agent 1: B8.3a (1 story), Agent 2: B8.3b + B8.3c (2 stories)"
    first_seen: "2026-02-09"
    times_seen: 1
    applications: 0
    confidence: "high"  # User explicitly identified the violation
    enforcement_pseudo_code: |
      def verify_agent_allocation(stories: List[Story]) -> List[List[Story]]:
          """Pre-flight check for agent allocation"""
          import math
          max_stories_per_agent = 2

          # Group by waves if applicable; treat all stories as single wave if no waves
          waves = group_by_waves(stories) or [stories]

          allocation = []
          for wave in waves:
              agents_in_wave = math.ceil(len(wave) / max_stories_per_agent)
              for i in range(agents_in_wave):
                  start = i * max_stories_per_agent
                  end = min(start + max_stories_per_agent, len(wave))
                  allocation.append(wave[start:end])

          # Verify no agent exceeds max
          for agent_stories in allocation:
              assert len(agent_stories) <= max_stories_per_agent

          return allocation

  # ============================================================================
  # PRO-NUC.4 LEARNINGS (2026-05-03)
  # PRO-NUC.1/2/3 shipped a feature that LOOKED complete (worker pipeline,
  # canvas service, raster assets baked, all merged) but the user-facing
  # behaviour regressed because two trigger surfaces and one infra prereq
  # were never enumerated in the sprint scope. A follow-up PR (#1313) had
  # to wire what should have been wired in PRO-NUC.2.
  # ============================================================================

  - id: SPL-014
    category: scope-definition
    pattern: "ENUMERATE TRIGGER SURFACE: For any feature that can be invoked from multiple entry points, list every entry point in the story scope and add a per-trigger E2E acceptance test"
    description: |
      CRITICAL: When scoping a story whose value is "this pipeline produces
      X output," the planning phase MUST enumerate every trigger surface
      that can invoke the pipeline. For each trigger, the story's
      acceptance criteria must include "trigger T produces output X
      end-to-end against the local docker stack." A story that only tests
      the canonical trigger (HTTP route, button click) silently ships
      "complete" while parallel trigger paths (chat tools, scheduled jobs,
      webhooks, AG-UI events, MCP tool calls) continue to use legacy code.

      Trigger surfaces to enumerate (non-exhaustive):
        * HTTP REST routes (`POST /...`)
        * UI button handlers (frontend-driven)
        * Chat agent tools (`{agent}.{tool}` invocations)
        * Scheduled jobs (cron, APScheduler, ARQ recurring)
        * Webhook receivers
        * MCP server tools (external clients)
        * Internal pub/sub event handlers
        * CLI scripts / management commands

      Each trigger that invokes the pipeline must be in scope for the
      story OR explicitly out-of-scope with a referenced follow-up
      story ID.  "Out of scope and undocumented" = guaranteed regression.

      ENFORCEMENT: Story authoring template now includes a mandatory
      "Trigger Surface" section listing every entry point + the test
      that proves it produces the new behaviour. Story review rejects
      any story whose pipeline could be invoked from a path not listed.
    evidence:
      session: "2026-05-03 PRO-NUC.4 follow-up PR #1313"
      user_feedback: |
        "and so confused... isn't this what our pro-nuc-1, pro-nuc-2,
        pro-nuc-3 stories (mini-sprint) was supposed to handle??"
      shipped_gap: |
        PRO-NUC.2 (#1306) wired prebuild_proposal_figures + enrich_cover_letter
        into the ARQ worker task `proposal_generate_task`. Verified correct
        on disk. BUT the chat tool `proposal.export_documents` had its own
        divergent inline-generation code at agent.py:1183-1439 that built
        export data from conversation history, instantiated generators with
        cls() (no figures_assets_root), and uploaded synchronously. NEVER
        enqueued anything. Every chat-triggered export silently regressed
        to native-mode parity. PRO-NUC scope assumed the canonical trigger
        was the Export button on the proposal page; the chat tool was never
        listed in the trigger surface and thus never E2E-tested.
      remediation_pr: "PR #1313 (feat/pro-nuc-4-chat-export-async-arq)"
    first_seen: "2026-05-03"
    times_seen: 1
    applications: 0
    confidence: "high"  # User explicitly identified the gap; high-stakes regression
    enforcement_template: |
      ## Story Section: Trigger Surface

      List every entry point that can invoke this story's pipeline.
      For each, declare in-scope (with a per-trigger E2E test) or
      out-of-scope (with a follow-up story ID).

      | Trigger | Status | E2E Test | Follow-Up |
      |---------|--------|----------|-----------|
      | POST /api/v1/foo/{id}/bar | in-scope | tests/integration/test_foo_route.py | — |
      | proposal.foo_bar chat tool | in-scope | tests/integration/test_chat_foo.py | — |
      | scheduled `foo_bar_daily` job | out-of-scope | — | FOO-BAR.5 |

      A story is NOT ready-for-dev until this section is filled.

  - id: SPL-015
    category: infra-prereqs
    pattern: "VERIFY INFRA PREREQS: Worker / queue / scheduler / external-service dependencies must be confirmed deployed in the target environment's docker-compose (or equivalent) BEFORE the story is marked ready-for-dev"
    description: |
      CRITICAL: When a story depends on a background worker, queue
      consumer, scheduled job, or external service, the planning phase
      must verify that the infra is actually deployed in the target
      environment — not just that the code exists.

      Common assumption failures:
        * "We have an ARQ worker" → no `worker:` service in docker-compose
        * "Cron jobs run nightly" → no scheduler container in compose
        * "Canvas service is opt-in" → service exists but no story enables
          the canvas profile in the dev stack
        * "Worker initializes the DB" → worker.on_startup never calls init_db()
          (FastAPI lifespan does it; ARQ has no lifespan equivalent)

      Even if the code is correct on disk, an undeployed infra dep means
      the story silently doesn't work end-to-end. Worse, this gap is
      invisible to unit tests and only surfaces when a user actually
      triggers the new behaviour against the real stack.

      ENFORCEMENT: Story authoring template now includes a mandatory
      "Infra Prerequisites" section listing every required deployed
      component + the docker-compose service name (or equivalent) that
      provides it + the lifecycle hooks the component depends on
      (init_db, init_zep_client, etc.).  Story review verifies each
      listed component is actually present in the target compose file.
    evidence:
      session: "2026-05-03 PRO-NUC.4 follow-up PR #1313"
      user_feedback: |
        "and so confused... isn't this what our pro-nuc-1, pro-nuc-2,
        pro-nuc-3 stories (mini-sprint) was supposed to handle??"
      shipped_gap_a: |
        PRO-NUC.2 wired proposal_generate_task into the ARQ worker code,
        but no `worker:` service was ever added to docker/docker-compose.yml.
        The existing Export button POST /generate would have silently hung
        in this stack too — POST enqueues to Valkey, nothing consumes.
        Latent because nobody clicked Export through this stack post-merge.
      shipped_gap_b: |
        Worker `on_startup` hook never called `init_db()`. First time
        anything actually consumed `proposal_generate_task` it crashed
        with "Database not initialized". Latent because earlier tasks
        (send_pending_reminder) opened their own DB connections.
      remediation_pr: "PR #1313 added worker service + worker init_db wiring"
    first_seen: "2026-05-03"
    times_seen: 1
    applications: 0
    confidence: "high"
    enforcement_template: |
      ## Story Section: Infra Prerequisites

      List every deployed component this story depends on. For each,
      verify the docker-compose service exists in the target env AND
      its lifecycle hooks initialize the dependencies the FastAPI
      lifespan would otherwise provide.

      | Component | Compose Service | Lifecycle Hook Verified |
      |-----------|-----------------|-------------------------|
      | ARQ worker | `worker` (in docker-compose.yml) | `on_startup` calls init_db |
      | Valkey | `valkey` | n/a (external) |
      | Canvas service | `canvas-service` (profile: canvas) | health endpoint reachable |

      A story is NOT ready-for-dev until each row's "Lifecycle Hook
      Verified" column is populated and reviewed.

  # ============================================================================
  # EPIC RBAC-1 LEARNINGS (2026-05-13)
  # Stories averaged 660 lines/story (range 474-804) with 26-40 DOD items each.
  # RBAC-1.5 (13 SP, 32 DOD items, 804 lines) self-acknowledged it was "two
  # implementation sessions, atomic PR" — the skill recognized over-sizing but
  # had no enforcement step. Result: PR #1394 took 15+ fix rounds.
  # ============================================================================

  - id: SPL-016
    category: story-atomicity
    pattern: "Validate story atomicity before ready-for-dev (Phase 2.5)"
    description: |
      CRITICAL: After Phase 2 writes all stories and BEFORE Phase 3 wrap-up,
      run the Phase 2.5 atomicity audit defined in
      `.claude/skills/qds-sprint-planning/steps/phase-2-5-atomicity-audit.md`.

      The audit checks every generated story for:
        1. Normative-content size  ≤ 200 lines (BLOCK above 250)
        2. Total file size          ≤ 400 lines (WARN)
        3. SP budget                ≤ 8 SP (BLOCK)
        4. DOD checkbox count       ≤ 10 high-signal items (WARN)
        5. Title AND-connectors     ≤ 1 conjunction (WARN)
        6. Blocker markers (⛔ / pending sign-off / TBD on) = 0 (BLOCK)
        7. ## Files to Modify section present + ≤ 10 unique files (BLOCK if absent)
        8. ## Security Invariants section required when ANY security-relevant
           keyword class matches (BLOCK if triggered+absent). Keyword classes
           (must remain byte-identical to bmad-create-story template.md
           #1433 and bmad-check-implementation-readiness #1431 — canonical
           source: `.claude/skills/bmad-create-story/template.md` §Security
           Invariants comment block):
             - RLS / row-level security / policy
             - migration / DDL / schema change / alembic
             - auth / authentication / authorization / RBAC / capability / scope / permission
             - encryption / secrets / KMS / vault / credential
             - PII / personal data / GDPR / HIPAA
             - payment / billing / financial / PCI
             - tenant / multi-tenancy / cross-tenant
             - upload / file handling / deserialization / parse

      Output: `_bmad-output/sprint-artifacts/sprint-{N}/atomicity-audit-{YYYY-MM-DD}.md`

      HALT before Phase 3 if any BLOCK-severity finding lacks an operator
      override entry. WARN findings are reported but non-blocking.

      Keyword list in check 8 must match bmad-create-story template (#1433)
      and bmad-check-implementation-readiness (#1431) verbatim. Any drift
      between the three is a bug.
    evidence:
      session: "2026-05-13 Epic RBAC-1 retro / skill audit §4.1"
      user_feedback: |
        Stories averaged 660 lines/story (range 474-804) with 26-40 DOD
        items each. RBAC-1.5 (13 SP, 32 DOD items, 804 lines) self-
        acknowledged it was "two implementation sessions, atomic PR" —
        the skill recognized over-sizing but had no enforcement step
        to split.
      remediation_pr: "Issue #1435 — adds Phase 2.5 gate"
      related_issues: ["#1428", "#1431", "#1432", "#1433", "#1434"]
    first_seen: "2026-05-13"
    times_seen: 1
    applications: 0
    confidence: "high"  # From sprint retro action item
    enforcement_reference: |
      See `.claude/skills/qds-sprint-planning/steps/phase-2-5-atomicity-audit.md`
      for the full check definitions, severity matrix, report format, and
      HALT logic.

  - id: SPL-017
    category: epic-namespacing
    pattern: "Phase 0: detect epic-code collisions and assign a dedicated namespaced epic code"
    description: |
      Before the Phase 0 confirmation gate, if the input plan uses generic /
      letter labels (e.g. "Epic A/B/C", story IDs like A1/B6/B7/E1/E2), grep
      `_bmad-output/epics.md` for `^## Epic` to enumerate the project's
      existing epic codes. If ANY of the plan's internal labels collide with
      an existing epic code, DO NOT proceed to confirmation — surface the
      collision and propose a dedicated, namespaced epic code that follows
      the project's named-code convention (PRO-NUC, RBAC-1, IAP, BGP, WEB-1).
      Remap the plan's internal labels to story suffixes under that code
      (e.g. plan label "B6" -> story PRO-HUB.B6). The plan's letters are
      logical-internal labels, NOT project epic codes.

      Rationale: the project keys epics.md sections, sprint-status.yaml
      `epic-{code}` blocks, and story-file slugs by epic code. A collision
      silently corrupts those status files and conflates two unrelated
      epics. This is a pre-confirmation, corruption-prevention guardrail.
    evidence:
      session: "2026-05-16 qds-sprint-planning for the Company Proposal Hub plan"
      user_feedback: |
        Plan's internal A/B/C/R/E/D labels (story IDs A1, B6, B7, E1, E2)
        collided with existing Epic A1 (Foundation, COMPLETE), Epic B6
        (HITL Gates UI), Epic B7 (Export & Analytics), Epic E1/E2 (Party
        Mode / Meta-Prompts). Caught at Phase 0; user accepted the
        recommended dedicated code "PRO-HUB"; labels remapped to
        PRO-HUB.{A1,B6,B7,B8,B1,B2a,B2b,B3prime,B4prime,B5,R1}.
    first_seen: "2026-05-16"
    times_seen: 1
    applications: 1
    confidence: "high"  # User accepted recommended namespacing; load-bearing corruption guardrail

  - id: SPL-018
    category: decision-philosophy
    pattern: "On delegated decision forks, choose the long-term enterprise-correct option even if it expands sprint scope"
    description: |
      When a decision fork arises at a gate (research-approval, story-review)
      and the user delegates the call with language like "what's the best
      enterprise-grade decision? no shortcuts; prefer the best long-term
      decision rather than prioritizing quick fixes or worrying about
      current scope" — recommend AND justify the architecturally-correct
      long-term option. Do NOT let "stay within the MVP / current sprint
      scope" override correctness. When the correct answer is more work,
      propose a new ATOMIC story or an additive contract change (and re-run
      the Phase 2.5 atomicity audit on the delta) rather than degrading the
      design or deferring with an undocumented gap.

      Corollary: prefer mirroring the real server/system contract over a
      client-side workaround (e.g. extend a typed client to match an
      endpoint the backend already validates, instead of a create-then-PUT
      two-step).
    evidence:
      session: "2026-05-16 qds-sprint-planning for Epic PRO-HUB"
      user_feedback: |
        User said (twice in one session): "what's best enterprise grade
        decision here? no shortcuts. prefer best long-term decision rather
        than prioritizing quick fixes or worrying about current scope" and
        "add per-deal $ to scope now". Drove: (1) a NEW atomic story
        PRO-HUB.B8 + revising B3'/B4' instead of honest-degradation;
        (2) ratifying R1's additive CreateProposalData.prospect_data?
        (backend already validates it) over a create-then-PUT workaround.
    first_seen: "2026-05-16"
    times_seen: 2
    applications: 1
    confidence: "high"  # Explicit + repeated 2x in one session + acted upon

  # ============================================================================
  # EPIC RBAC-1 RETRO SKILL AUDIT §4.5 (2026-05-16) — issue #1432
  # Single-shot adversarial review caught real structural issues but the chain
  # stopped after one pass; the next 50+ rounds of CR/Gemini surfaced issues
  # the one-shot review missed. Auto-iteration converges before commit + adds
  # pluggable domain-invariant checklists.
  # ============================================================================

  - id: SPL-024
    category: review-process
    pattern: "Auto-iterate adversarial review until findings stabilize"
    description: |
      Phase 3 wrap-up of qds-sprint-planning auto-invokes
      `bmad-review-adversarial-general` in a bounded iteration loop
      (max 3) against (a) each story file individually, (b) the
      cross-story consistency view, (c) the sprint-status.yaml entries
      staged for insertion, and (d) the targeted epic block in
      epics.md — BEFORE any commit or PR creation.

      Findings are categorized HIGH (structural — Alembic chain non-
      linearizable, dependency cycle, missing AC, capability bypass,
      cross-story contradiction) / MEDIUM (clarity — ambiguous
      wording, missing spec reference, undefined acronym) / LOW (nits
      — typos, formatting).

      Exit condition: `HIGH == 0 AND MEDIUM <= 3`. Each iteration's
      fixes are applied as an in-place re-write of the Phase 2 output
      (NOT a separate commit; integrated into the wrap-up commit).

      Pluggable domain checklists in
      `.claude/skills/qds-sprint-planning/checklists/<domain>.md`
      are auto-loaded into the `also_consider` payload when matching
      trigger keywords appear in story / epic text:

      | Triggers                                                                 | Checklist                     | Shipped |
      |--------------------------------------------------------------------------|-------------------------------|---------|
      | rls / row-level security / RLS policy                                    | rls-invariants.md             | yes     |
      | migration / migrations / alembic / DDL / schema change                   | migration-invariants.md       | yes     |
      | auth / authn / authz / rbac / capability / authentication / authorization | auth-invariants.md            | yes     |
      | encryption / secret / secrets / KMS / vault                              | secrets-invariants.md         | yes     |
      | upload / uploads / deserialization / file handling                       | input-invariants.md           | yes     |
      | pii / gdpr / personal data                                               | pii-invariants.md             | deferred |
      | payment / payments / billing / financial                                 | payments-invariants.md        | deferred |

      If iteration 3 ends with surviving HIGH or > 3 MEDIUM findings,
      Phase 3 surfaces a disposition table to the operator and HALTs
      until the operator chooses
      `[a]pply / [r]e-iterate / [e]dit / [q]uit`.

      The iteration log (counts per iteration, dispositions taken,
      which domain checklists fired) is appended to the wrap-up
      commit's PR body so reviewers see what was caught before code
      review.
    evidence:
      session: "2026-05-13 Epic RBAC-1 retro skill audit §4.5"
      user_feedback: |
        Epic RBAC-1 ran adversarial review ONCE during planning
        (commit 99cce9d3b: "adversarial review fixes — linearize
        Alembic chain, scope"). It caught real structural issues
        — but the manual chain stopped there. The next 50+ rounds
        of CodeRabbit / Gemini PR feedback caught issues the single
        adversarial pass missed.
      shipped_gap: |
        Single-shot adversarial review surfaces one layer of
        findings. Re-running against the rewritten content surfaces
        a fresh layer. Two-to-three passes converge — and the
        convergence criterion itself is a signal that the spec is
        sound. Without an auto-loop, the convergence work fell to
        CR/Gemini at PR-review time, paying the cost in human review
        cycles instead of catching it pre-commit.
      remediation_pr: "PR for issue #1432 (this entry)"
    first_seen: "2026-05-16"
    times_seen: 1
    applications: 0
    confidence: "medium"  # Newly introduced; promote to high after
                          # observing 3+ successful Phase 3 runs that
                          # converged on iteration 1 or 2.
    citations:
      - "GitHub issue #1432"
      - "_bmad-output/sprint-artifacts/sprint-62/epic-rbac-1-retro-skill-audit-2026-05-13.md §4.5"
      - ".claude/skills/qds-sprint-planning/steps/phase-3-wrap-up.md"
    enforcement_template: |
      ## Phase 3 Step 0: Adversarial Auto-Iteration

      Before any of the file-write / commit / PR steps in Phase 3,
      run the loop documented in
      `.claude/skills/qds-sprint-planning/steps/phase-3-wrap-up.md`:

      ```
      loaded_checklists = scan story files + epic for trigger keywords
      for iteration in 1..3:
        findings = bmad-review-adversarial-general(
          content = stories + cross-story view + sprint-status + epic block,
          also_consider = loaded_checklists,
        )
        categorize HIGH / MEDIUM / LOW
        if HIGH == 0 AND MEDIUM <= 3: break
        if iteration < 3:
          apply fixes in-place (no separate commit)
        else:
          # iteration 3: do NOT auto-apply; reserve for operator
          surface disposition table, HALT.
      ```

      Iterations 1 and 2 auto-apply fixes in-place. Iteration 3 is
      reserved for operator disposition: if convergence is not reached
      by the end of iteration 2, iteration 3 runs the review one more
      time to produce a final findings snapshot but does NOT auto-apply
      fixes; instead it surfaces the disposition table
      (`[a]pply / [r]e-iterate / [e]dit / [q]uit`) and HALTs.

      The wrap-up PR body must include the iteration log:
      iterations run, HIGH/MEDIUM/LOW counts per iteration, which
      domain checklists fired, operator dispositions (if any).
