learnings:
  - id: SPL-001
    category: agent-allocation
    pattern: "Max 2 stories per writing agent"
    related_patterns: [SPL-013]  # Enforcement mechanism via pre-flight check
    description: |
      When launching writing agents in Phase 2, assign maximum 2 stories
      per agent to maintain quality and context. This prevents context overflow
      and ensures each story receives proper attention.

      ENFORCEMENT: This is a pre-flight check that MUST be verified before
      spawning any writing agents. Calculate: num_agents = ceil(total_stories / 2).
    evidence:
      session: "2026-02-02 qds-sprint-planning for Epic B6"
      user_feedback: "User corrected: 'the subagents doing the writing handle more
      than 1-2 stories, each?? that should be the max'"
      correction: "Agent 4 was assigned 5 stories (B6.7, B6.3a, B6.3b, B6.5a, B6.5b)
      when max should be 2 per agent"
    first_seen: "2026-02-02"
    times_seen: 4
    applications: 2
    confidence: "high"  # User explicitly elevated: "that is a must change"
    recurrence_evidence:
      session: "2026-02-09 qds-sprint-planning for Epic B8"
      user_feedback: "i noticed that it used a single subagent to write 3 stories
