  - id: SPL-006
    category: auto-split-sizing
    pattern: "AUTO-SPLIT: Stories > 5 points must be split into smaller substories"
    description: |
      CRITICAL: When ANY story is estimated at 6+ points (above the 3-5 point target),
      the skill MUST proactively split it into smaller substories of ~4 points each.
      This is not optional - the user explicitly requires max 3-5 points per story.

      Default split pattern for agent stories:
      - A (Core): Agent class, system prompt, orchestration logic (~4 pts)
      - B (Tools): Individual tool implementations with Pydantic schemas (~4 pts)

      For non-agent stories, split by logical boundaries (UI/data/processing).
    evidence:
      session: "A7.1/A7.2 story splitting (2026-02-06)"
      user_feedback: "User explicitly requested: 'we need each story to be max 3-5 points.
      so please split each into an a and b substory, each about 4 points if possible'"
      correction: "A7.1 (8 pts) -> A7.1A (4 pts) + A7.1B (4 pts),
      A7.2 (8 pts) -> A7.2A (4 pts) + A7.2B (4 pts)"
    first_seen: "2026-02-06"
    times_seen: 1
    applications: 1
    confidence: "high"  # User explicitly requested, MUST APPLY
    auto_split_rules: |
      TARGET SIZE: 3-5 points per story
      SPLIT TRIGGER: story_points >= 6

      Default split pattern:
      - If 6-8 points: Split into A + B (~4 pts each)
      - If 9-12 points: Split into A + B + C (~4 pts each)
