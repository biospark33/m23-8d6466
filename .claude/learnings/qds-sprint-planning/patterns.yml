  # A6.6 Code Review Learnings (2026-02-06)
  - id: SPL-002
    category: story-definition
    pattern: "API Contract Must Match Implementation Exactly"
    description: |
      When defining stories with REST API endpoints, the Pydantic request/response
      schemas must match the story spec exactly. Common mismatches include:
      - Including path params (rfp_id) in request body when they're already in URL
      - Returning dict[str, Any] instead of typed response model
      - Missing fields that are specified in the AC criteria

    evidence:
      story: "A6.6 Gate 5 API Bridge"
      issues_found:
        - "SignatureRequest had rfp_id field but URL already has /signature/{rfp_id}"
        - "ApprovalRequest had rfp_id field but URL already has /approve/{rfp_id}"
        - "FinalResponseResponse structure didn't match AC1 spec"
      fix_effort: "4 hours to fix schemas, tests, and implementation"
    first_seen: "2026-02-06"
    times_seen: 1
    applications: 0
    confidence: "high"

  - id: SPL-003
    category: story-definition
    pattern: "Define Test Fixtures Alongside Story Scaffolding"
    description: |
      When scaffolding a new story with API endpoints, create the test fixtures
      (conftest.py) and mock clients BEFORE implementing endpoints. This prevents
      discovering fundamental testing issues during code review.
    evidence:
      story: "A6.6 Gate 5 API Bridge"
      problem: "Mock valkey client was sync Mock() instead of async class"
      discovered: "During code review, not during implementation"
      impact: "Tests failed with TypeError, required complete rewrite of conftest.py"
    first_seen: "2026-02-06"
    times_seen: 1
    applications: 0
    confidence: "high"

  - id: SPL-004
    category: architecture
    pattern: "Stub Adapter Limitations Must Be Documented In Story"
    description: |
      When a story uses stub adapters (for external systems not yet implemented),
      the story spec must explicitly document:
      1. What the stub does (or doesn't do)
      2. Where real validation happens (if stub is bypassed)
      3. How tests should handle the stub

    evidence:
      story: "A6.6 Gate 5 API Bridge"
      issue: "_StubRBACAdapter returns None, but state machine validates this as 'invalid role'"
      missing: "Documentation that API layer handles RBAC, state machine should skip it"
      fix: "Passed rbac=None to state machine, added comments explaining the bypass"
    first_seen: "2026-02-06"
    times_seen: 1
    applications: 0
    confidence: "high"

  - id: SPL-005
    category: testing
    pattern: "Integration Tests Must Cover Multi-Call Workflows"
    description: |
      Stories with workflows (create signature → approve) need integration tests
      that verify the full sequence, not just individual endpoints. Unit tests that
      mock storage between calls don't catch state machine bugs.
    evidence:
      story: "A6.6 Gate 5 API Bridge"
      unit_tests: "Each endpoint tested in isolation with fresh mock"
      integration_gap: "No test verified signature → approval workflow"
      bug_found: "Lock operation failed because mock didn't persist state"
    first_seen: "2026-02-06"
    times_seen: 1
    applications: 0
    confidence: "medium"  # Integration tests existed but needed expansion

