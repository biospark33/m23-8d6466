name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same branch are wasted runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Full local run is ~35s; 15 min caps a hung child process instead of
    # burning the 6h default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Root install also covers cli-anything/ (not a declared workspace, but
      # its deps hoist from the root lockfile) — see #54.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
