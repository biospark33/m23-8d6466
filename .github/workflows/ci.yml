name: CI

on:
  # Actions-minutes policy: a FULL run happens only for a change that is
  # actually merging into dev or main, and exactly once.
  #
  #   * `branches: [main, dev]` — a PR stacked onto another feature branch is
  #     not a merge into an integration branch; it gets nothing until it is
  #     retargeted at dev.
  #   * no `push:` leg — the post-merge push to dev/main would re-test the very
  #     tree the PR just tested green, doubling the bill for zero new
  #     information. (Both legs were running: see the paired
  #     push/pull_request runs in the Actions history.) The ruleset on
  #     dev/main requires a PR + 1 approval and no required status checks, so
  #     nothing depended on the push leg.
  #   * `paths-ignore` — docs-only changes cannot break a typecheck, a lint or
  #     a test. GitHub skips the run only when EVERY changed path matches, so a
  #     mixed docs+code PR still runs in full.
  #
  # `workflow_dispatch` is the escape hatch for forcing a run on any ref.
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - .github/ISSUE_TEMPLATE/**
      - LICENSE
  workflow_dispatch:

# Superseded runs on the same branch are wasted runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Consumed by `image` below to skip a 30-min-cap OCI build on the PRs that
    # cannot possibly change the image.
    outputs:
      image-relevant: ${{ steps.image-relevant.outputs.result }}
    permissions:
      contents: read
      # Job-scoped, not workflow-scoped: only check-pr-conflicts.sh below needs
      # it (`gh pr list` / `gh pr diff`), and `image` must not inherit it.
      pull-requests: read
    # This job is NOT ~35s (the old comment was a 15x understatement): it runs
    # install + 3 typechecks (F011 added cli-anything) + 2 lints + `bun test` +
    # `test:visualizer` + `check:lcov` + `build:check` + `check:coverage`
    # (F083; +~150 s locally — it re-runs tests/scripts + tests/providers under
    # coverage instrumentation). Measured full-suite wall time locally:
    # 478 s, 498 s, 486 s, plus 500-563 s across the four runs recorded in
    # TECH_DEBT_AUDIT.md (F082) — roughly 8-10 minutes, before CI's colder
    # install and slower runners. 25 min caps a hung child process with real
    # headroom instead of burning the 6h default.
    #
    # `test:visualizer` re-runs visualizer/test/** that the root `bun test`
    # already covers, and it is KEPT deliberately: visualizer/bunfig.toml only
    # resolves for runs whose cwd is visualizer/, so this is the sole
    # coverage-instrumented run and the only producer of the lcov that the
    # `check:lcov` step below gates on. Dropping it would drop the coverage gate.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The two dev gates below diff from `git merge-base origin/<base> HEAD`.
          # checkout's default depth of 1 has no merge-base and no origin/main
          # ref at all, so both would die on the first line. Full history is the
          # price of running them here.
          fetch-depth: 0
      # F096: no bun-version means `latest`. This repo is Bun-API-load-bearing
      # (Bun.spawn, bun:sqlite, bun:test, todoIf), so a Bun point release can
      # turn a green main red with no repo change.
      #
      # 1.3.13 -> 1.4.2 (issue #250). Under 1.3.13 the runner's full `bun test`
      # dies mid-suite with `panic: us_create_timer: returned null: 24` (EMFILE
      # at timer creation) and SIGILL exit 132, after ~6.4k spawns, with ZERO
      # test failures — six runs since 2026-09-10. Raising the step's soft fd
      # limit to the runner's hard limit was tried and did NOT help (0d8b97db,
      # run 35536475252, crash again at spawn(6450)); it was reverted in
      # 8576497c. That rules the process fd ceiling out and leaves the runtime,
      # which is what this bump replaces.
      #
      # This pin is DELIBERATELY ahead of `packageManager` in package.json,
      # which stays at 1.3.13: `readBunPin` feeds that field to the exedev
      # image's `ARG BUN_VERSION`, so moving it re-derives the image build id
      # and owes the whole pin-adoption ritual. This bump is the CI runner
      # only — no substrate change. Re-align the two when the image is next
      # re-pinned.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      # Actions-minutes policy: the `image` job is a cold npm install plus two
      # image stages plus a layer scan. Nothing in it can change unless one of
      # these paths does, so gate it on a diff rather than paying for it on
      # every PR. Mirrors on.push.paths in publish-exedev-image.yml, plus the
      # lockfile (a dependency bump changes what the sweep attributes).
      # fetch-depth: 0 above is what makes the three-dot diff resolvable.
      - id: image-relevant
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # workflow_dispatch has no base_ref — a forced run builds everything.
          if [ -z "$BASE_REF" ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/$BASE_REF...HEAD" \
            | grep -qE '^(oci/|scripts/build-exedev-image\.ts$|package\.json$|bun\.lock$)'; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi
      # F089: cli-anything IS a declared workspace (package.json `workspaces`,
      # bun.lock records it as a member) — the old comment here claimed the
      # opposite. The root install resolves it as a member; there is no separate
      # per-package install, and a stale pre-workspace cli-anything/node_modules
      # tree must not exist (it shadows the hoisted, lockfile-pinned versions).
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The visualizer is a separate TS project (its own tsconfig + vue-tsc);
      # the root typecheck/lint do not reach it. DF4.1.
      - run: bun run typecheck:visualizer
      # F011: cli-anything is EXCLUDED from the root tsconfig (tsconfig.json
      # "exclude"), so `bun run typecheck` never compiled its 3,295 LOC — the
      # budget-kill and watchdog paths in runner.ts included. It defines its own
      # `typecheck` script; nothing invoked it. Same treatment the visualizer got.
      - run: bun run typecheck:cli-anything
      - run: bun run lint
      - run: bun run lint:visualizer
>>>>>>> origin/dev
      # DF4.2 coverage gate. Two steps so the coverage run's own exit status
      # (bunfig's aggregate line threshold) gates first, then check-lcov.ts
      # enforces per-file line+function floors and fails loudly on any
      # server/**/src/lib/**/deploy.ts file bun never loaded at all — the
      # blind spot the aggregate threshold can't see.
      - run: bun run test:visualizer
      - run: bun run check:lcov
      - run: bun run --cwd visualizer build:check
      # F083 coverage gate for the trees with the blast radius. Deliberately a
      # SEPARATE bunfig (bunfig.coverage.toml) and a separate run: a root
      # bunfig.toml would turn coverage on for the whole-repo `bun test` above
      # and gate 15,740 LOC of scripts/ at once, which is not what this is for.
      # Scope is scripts/lib/** + src/providers/** — run-lock.ts and
      # cost-ledger-opts.ts guard destructive verbs, and had no floor at all
      # while the visualizer sat at 90%. The threshold is the CURRENT measured
      # number floored to a clean value, so it ratchets rather than chasing.
      - run: bun run check:coverage
      # F095 / decision Q10: these two gates were written, tested, and invoked by
      # nothing — every record of them passing was a hand-run transcribed into
      # story prose. They gate now, from here.
      #
      # ADVISORY while the backlog is non-zero. Measured 2026-08-28 on
      # feature/tech-debt-w3-green vs origin/main: check-defensive-programming.sh
      # = 8 findings (4x D016, 3x D018, 1x D017); check-pr-conflicts.sh = 51
      # overlapping files across the stacked tech-debt PRs (#141, #147).
      #
      # `--warn` is the ONLY advisory mechanism here. Both scripts downgrade
      # confirmed FINDINGS under --warn but still exit nonzero on a BROKEN SCAN
      # (missing origin/main, unauthenticated gh, moved script) — so a gate that
      # scanned nothing goes red, which is the whole point of F095.
      #
      # `continue-on-error` is deliberately NOT used: it cannot tell those two
      # cases apart, so it would swallow the broken-scan failure too and negate
      # the property above. An advisory gate that cannot go red is not a gate.
      #
      # FLIP CONDITION: when a `--base origin/main` run of
      # check-defensive-programming.sh on a fresh branch prints
      # "OK: no defensive-programming findings", delete `--warn` from its run
      # line so findings block. Same rule, independently, for the conflicts step.
      #
      # base_ref/head_ref go through env, never `${{ }}` inside run: — expression
      # substitution happens before the shell parses, so an attacker-named fork
      # branch would execute as shell, and quoting the interpolation does not help.
      - name: Defensive-programming gate (advisory — 8 findings, see comment)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/dev/check-defensive-programming.sh --base "origin/$BASE_REF" --warn
      - name: Stacked-PR conflict gate (advisory — 51 overlaps, see comment)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/dev/check-pr-conflicts.sh --base "origin/$BASE_REF" --branch "$HEAD_REF" --warn

  # DF2.9: the enterprise image contract. The license sweep is the gate — a
  # denied package, a broken pin, or a package the build cannot attribute exits
  # nonzero from `build:image`, which fails this job before anything is tagged.
  # issue #250: the suite cannot finish in one `bun test` process. Five
  # measurements, each ruling something out rather than arguing about it:
  #   1. One process over all 196 files dies at ~6.4k spawns every time —
  #      `us_create_timer: returned null: 24` (EMFILE, exit 132) on bun 1.3.13,
  #      `eventfd() failed during loop init` (exit 134) on 1.4.2 — with ZERO
  #      test failures before the crash.
  #   2. `ulimit -n "$(ulimit -Hn)"` (0d8b97db): a no-op. The runner reports
  #      soft=hard=65536, so raising soft TO hard changes nothing.
  #   3. `sudo prlimit --nofile=1048576` (run 35637724630): the raise took
  #      effect — the step logged `fd after: soft=1048576` — and the suite still
  #      died at spawn(6396), the same point as under 65536. A 16x budget that
  #      buys zero extra spawns rules the fd CEILING out.
  #   4. Four sequential processes in one job (run 35639471439): shard 1 clean,
  #      shard 4 SIGABRT.
  #   5. Four processes on four separate RUNNERS (run 35641333046): shards 1
  #      and 2 green, shard 4 SIGABRT again at 180s on a VM of its own.
  #   6. Batches of 8 (run 35644090068): 24 of 25 batches clean, batch 3
  #      SIGABRT at 150s — tests/fleet/{approvers,attach,brief-schema,cli,
  #      dispatch}.test.ts plus three tests/fleet/e2e/ files.
  # (5) rules out budget, ceiling and whole-run accumulation; (6) localises what
  # is left to the spawn-heaviest corner of the suite. So the run is now one
  # file per process — the smallest bound there is, and cheap: the batches of 8
  # holding no heavy file finished in 0.1s. A file that still cannot survive
  # alone will name itself, since every batch prints its files first.
  tests:
    runs-on: ubuntu-latest
    # The batched run is ~14 min of test time plus install; 30 caps a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # F096: same pin as `check` — see the comment there.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Explicit roots (tests visualizer cli-anything) = every bun test file in
      # the repo. The roots are REAL roots here — test-batches.ts globs each
      # root — not bun's substring path args, so the vendored
      # pi-vs-claude-code-vendor/self-compact/tests/** stays OUT: those run
      # under their own node:test runner (bun's shims fail on them).
      - run: bun scripts/ci/test-batches.ts tests visualizer cli-anything

  image:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.image-relevant == 'true'
    # A cold npm install + two image stages + the layer scan; 30 min caps a
    # hung pull rather than burning the 6h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # F096: this is the RUNNER's bun, same pin as the `check` job (1.4.2,
      # issue #250). It is deliberately NOT `packageManager`'s 1.3.13: the bun
      # that ends up INSIDE the image comes from `readBunPin(package.json)` via
      # `ARG BUN_VERSION`, and this step cannot change it. The image's own pin
      # stays in lockstep with `packageManager`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      # Deliberately NOT docker/setup-buildx-action: it selects a
      # docker-container-driver builder, whose output stays in the build cache
      # unless --load/--push is given. `build:image` then extracts the tree with
      # `docker create <id>`, scans the image and tags it — all of which need
      # the image in the daemon's local store. The runner's default `docker`
      # driver puts it there, which is also what the local build uses.
      - run: bun run build:image
      - name: Upload sweep summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: license-sweep-summary
          path: |
            oci/.build/sweep-summary.json
            oci/.build/NOTICE
          if-no-files-found: warn
