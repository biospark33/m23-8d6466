name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same branch are wasted runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # This job is NOT ~35s (the old comment was a 15x understatement): it runs
    # install + 2 typechecks + 2 lints + `bun test` + `test:visualizer` +
    # `check:lcov` + `build:check`. Measured full-suite wall time locally:
    # 478 s, 498 s, 486 s, plus 500-563 s across the four runs recorded in
    # TECH_DEBT_AUDIT.md (F082) — roughly 8-10 minutes, before CI's colder
    # install and slower runners. 25 min caps a hung child process with real
    # headroom instead of burning the 6h default.
    #
    # `test:visualizer` re-runs visualizer/test/** that the root `bun test`
    # already covers, and it is KEPT deliberately: visualizer/bunfig.toml only
    # resolves for runs whose cwd is visualizer/, so this is the sole
    # coverage-instrumented run and the only producer of the lcov that the
    # `check:lcov` step below gates on. Dropping it would drop the coverage gate.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      # Root install also covers cli-anything/ (not a declared workspace, but
      # its deps hoist from the root lockfile) — see #54.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The visualizer is a separate TS project (its own tsconfig + vue-tsc);
      # the root typecheck/lint do not reach it. DF4.1.
      - run: bun run typecheck:visualizer
      - run: bun run lint
      - run: bun run lint:visualizer
      - run: bun test
      # DF4.2 coverage gate. Two steps so the coverage run's own exit status
      # (bunfig's aggregate line threshold) gates first, then check-lcov.ts
      # enforces per-file line+function floors and fails loudly on any
      # server/**/src/lib/**/deploy.ts file bun never loaded at all — the
      # blind spot the aggregate threshold can't see.
      - run: bun run test:visualizer
      - run: bun run check:lcov
      - run: bun run --cwd visualizer build:check

  # DF2.9: the enterprise image contract. The license sweep is the gate — a
  # denied package, a broken pin, or a package the build cannot attribute exits
  # nonzero from `build:image`, which fails this job before anything is tagged.
  image:
    runs-on: ubuntu-latest
    needs: check
    # A cold npm install + two image stages + the layer scan; 30 min caps a
    # hung pull rather than burning the 6h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      # Deliberately NOT docker/setup-buildx-action: it selects a
      # docker-container-driver builder, whose output stays in the build cache
      # unless --load/--push is given. `build:image` then extracts the tree with
      # `docker create <id>`, scans the image and tags it — all of which need
      # the image in the daemon's local store. The runner's default `docker`
      # driver puts it there, which is also what the local build uses.
      - run: bun run build:image
      - name: Upload sweep summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-sweep-summary
          path: |
            oci/.build/sweep-summary.json
            oci/.build/NOTICE
          if-no-files-found: warn
