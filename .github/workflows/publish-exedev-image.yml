name: Publish exedev boot image

# DF2.10: publishes the factory-owned boot image that every exe.dev sandbox
# boots from. Two properties make this workflow load-bearing rather than a
# convenience wrapper around `docker push`:
#
#   1. The image is PUBLIC. The operator decision (DF2.10 AC4) is a public
#      source image that customers mirror into their own tenant registry, so
#      NO pull credential exists on the production path at all — `create()`
#      passes `--image` and nothing else, and the `--registry-auth` argv
#      hazard (INV-IBOX-3) never arises. That decision is only true if the
#      package is actually public, which the anonymous-pull step below proves.
#   2. The pushed manifest digest must EQUAL the pin recorded in the repo
#      (`DEFAULT_IMAGE_REF` in src/providers/exedev/driver.ts). A publish that
#      moves the digest without moving the pin means production boots an image
#      no review saw — the gate step refuses it.
#   3. The pin is SIGNED, and signing it does not move it. The build turns
#      buildx's in-band provenance off to get a stable digest to pin at all, so
#      the provenance is re-attached here as an OCI referrer after the push —
#      and the step after that re-reads the tag to prove the digest and the
#      manifest media type did not budge. "Out of band" is checked, not claimed.
#
# Bootstrapping ritual (first publish, and every image change after): run this
# via workflow_dispatch, let the gate fail, paste the two constant lines it
# prints into driver.ts, commit, re-run. There is deliberately no
# `--allow-unpinned` input: a gate with a documented bypass is not a gate.
#
# That ritual TERMINATES only because the image is built at the last revision of
# the image source tree, not at HEAD — see the "Resolve the image source
# revision" step, which is the whole reason a second run converges instead of
# chasing its own pin-adoption commit forever.

on:
  workflow_dispatch:
  # NOT on every push. Only when the image tree or its builder actually
  # changes — a publish is a registry write and a new digest, so running it on
  # unrelated commits would churn packages and fail the pin gate on noise.
  push:
    # Feature branches publish via workflow_dispatch only. Left unfiltered,
    # any branch touching oci/exedev/** would write a package tag.
    branches: [main, dev]
    # KEEP IN LOCKSTEP with SOURCE_PATHS in the "Resolve the image source
    # revision" step. The two answer the same question — "what determines the
    # image bytes?" — and a path present in one but not the other means either
    # a change that should publish does not, or a publish rebuilds at a
    # revision the trigger never considered part of the image.
    paths:
      - oci/exedev/**
      - scripts/build-exedev-image.ts

# Two concurrent publishes race on the same package: whichever pushes second
# wins the tag, and the first run's gate then reads back a digest that is no
# longer what it built. cancel-in-progress is FALSE on purpose — cancelling
# mid-push leaves a partially-uploaded blob set, which is worse than queuing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Workflow-level default is read-only. Every elevation is granted per JOB, in
# the smallest job that needs it — see the `permissions:` blocks below and the
# comment on the `attest` job for why the OIDC pair is not granted here.
permissions:
  contents: read

env:
  # ghcr paths are case-sensitive and must be lowercase; this one already is.
  IMAGE_PATH: biospark33/qds-exedev
  IMAGE: ghcr.io/biospark33/qds-exedev
  DRIVER: src/providers/exedev/driver.ts
  BUILD_DIR: oci/exedev/.build

jobs:
  publish:
    # NATIVE amd64, non-negotiable. exe.dev boxes are x86_64 and the image MUST
    # be linux/amd64; building on a maintainer's arm64 laptop (or an arm runner)
    # produces an image that pushes fine, pins fine, and fails to boot — the
    # exact silent failure the digest pin exists to prevent. The platform is
    # asserted on the pulled image below rather than trusted.
    runs-on: ubuntu-latest
    # A base pull, one image build, an exported-filesystem license sweep and a
    # push. 30 min caps a hung pull rather than burning the 6h default — same
    # reasoning as ci.yml's `image` job.
    timeout-minutes: 30
    # `packages: write` is the only registry elevation, and it is the built-in
    # GITHUB_TOKEN — there is no PAT anywhere in this workflow, by the same AC4
    # decision that makes the image public. Notably ABSENT: `id-token: write`
    # and `attestations: write`. Both are granted to the `attest` job instead,
    # so the untrusted-code surface of this job — `bun install` running
    # lifecycle scripts from the dependency tree, and a build that executes a
    # Dockerfile — never has ACTIONS_ID_TOKEN_REQUEST_TOKEN in its environment
    # and so cannot mint an OIDC token that Fulcio would bind to this
    # repository. That is the concrete exposure, not a compliance box.
    permissions:
      contents: read
      packages: write
    outputs:
      # The tag the attest job re-reads. Computed, not `sha-${{ github.sha }}`:
      # see the source-revision step.
      tag: ${{ steps.src.outputs.tag }}
      # The pinned digest, which the gate below has PROVEN equal to what was
      # pushed. The attest job re-reads the tag against this before signing.
      digest: ${{ steps.pin.outputs.expected_digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          # DF2.9 round 3, zizmor `artipacked`: checkout persists the token in
          # .git/config by default, where any later step (or a build script
          # reading the repo) can lift it. Nothing here talks to git after
          # checkout — the source-revision step below reads LOCAL history only.
          persist-credentials: false
          # Required by that step: `git log -- <paths>` on the default depth-1
          # checkout can only ever answer "HEAD, or nothing", which would make
          # the source revision equal to HEAD again and re-break convergence.
          fetch-depth: 0
      # F096: same pin as ci.yml's two jobs — no bun-version means `latest`,
      # and this repo is Bun-API-load-bearing. Keep in lockstep with
      # `packageManager` in package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile

      # WHY THIS EXISTS: without it the pin gate can never go green twice.
      #
      # The image bakes /etc/qds-image.json with `gitSha` and `imageRef`, and
      # the reproducible-build epoch is a commit timestamp — so the digest is a
      # function of the revision it is built at. Build at HEAD and the
      # documented ritual is an infinite loop: the gate prints a pin, the
      # operator commits it to driver.ts, and THAT COMMIT moves HEAD, so the
      # re-run builds a different image and the gate fails again with a fresh
      # digest, forever.
      #
      # The fix is to separate the revision the IMAGE is built from from the
      # commit that RECORDS its digest. `git log -1 -- <image source paths>`
      # names the former; a driver.ts pin-adoption commit does not touch those
      # paths, so it does not move it, and the re-run rebuilds bit-identically
      # to the pin it was handed. The tag and the epoch come from the same
      # revision for the same reason — both feed the digest.
      #
      # package.json is deliberately NOT in the list even though it carries the
      # bun pin: dependabot rewrites it weekly, and including it would move the
      # source revision (and therefore the digest) on dep bumps that change
      # nothing in the image. A bun-pin bump is still caught, one field over —
      # it moves the buildId, which the gate compares independently of the
      # digest.
      - name: Resolve the image source revision
        id: src
        run: |
          set -euo pipefail
          # Keep in lockstep with `on.push.paths` above.
          SOURCE_PATHS=(oci/exedev scripts/build-exedev-image.ts)
          src_sha=$(git log -1 --format=%H -- "${SOURCE_PATHS[@]}")
          if [ -z "$src_sha" ]; then
            echo "::error::no commit in this checkout's history touches ${SOURCE_PATHS[*]}."
            echo "Either the image tree was renamed (update SOURCE_PATHS *and* on.push.paths),"
            echo "or this is a shallow checkout (fetch-depth: 0 is required above)."
            exit 1
          fi
          src_epoch=$(git log -1 --format=%ct "$src_sha")
          {
            echo "source_sha=$src_sha"
            echo "source_epoch=$src_epoch"
            # Immutable per-SOURCE-revision tag. The tag is only a handle for
            # the push — the PIN is the digest. AC1(b)'s fallback arm (if
            # exe.dev's `--image` rejects digests) also needs an immutable tag,
            # and this is it.
            echo "tag=${IMAGE}:sha-${src_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "image source revision: $src_sha (epoch $src_epoch)"
          if [ "$src_sha" != "$GITHUB_SHA" ]; then
            echo "HEAD is $GITHUB_SHA — it does not touch the image source, so the image is built at $src_sha."
          fi

      # Read the pin BEFORE building. A missing or renamed constant must go red
      # here, not silently compare against an empty string later — F095's rule:
      # a gate that scanned nothing goes red.
      #
      # The file is FLATTENED before matching, and that is not defensive
      # padding. `DEFAULT_IMAGE_REF` is a 96-character digest reference, so the
      # formatter wraps it onto its own continuation line:
      #
      #     export const DEFAULT_IMAGE_REF =
      #       "ghcr.io/biospark33/qds-exedev@sha256:a706…";
      #
      # grep matches within a line, so `[[:space:]]*` in a line-oriented
      # pattern can never cross that newline no matter what it is spelled as —
      # the pattern simply never matched, and this gate reported "could not read
      # the image pin" on every run. `tr '\n' ' '` makes the declaration one
      # line and the same pattern matches whether the formatter wrapped it or
      # not, so a future re-wrap cannot silently disarm the gate again.
      - name: Read the repo pin
        id: pin
        run: |
          set -euo pipefail
          flat=$(tr '\n' ' ' < "$DRIVER")
          ref=$(printf '%s' "$flat" | grep -oE 'DEFAULT_IMAGE_REF[[:space:]]*=[[:space:]]*"[^"]+"' | head -1 | sed 's/.*"\(.*\)"/\1/')
          build_id=$(printf '%s' "$flat" | grep -oE 'DEFAULT_IMAGE_BUILD_ID[[:space:]]*=[[:space:]]*"[^"]+"' | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$ref" ] || [ -z "$build_id" ]; then
            echo "::error::could not read the image pin from $DRIVER."
            echo "Expected two module-level constants (DF2.10 AC3):"
            echo '  export const DEFAULT_IMAGE_REF = "'"$IMAGE"'@sha256:<64hex>";'
            echo '  export const DEFAULT_IMAGE_BUILD_ID = "<16hex>";'
            echo "Found DEFAULT_IMAGE_REF=[$ref] DEFAULT_IMAGE_BUILD_ID=[$build_id]."
            echo "If these were renamed, this gate stopped gating — fix the grep, do not delete it."
            exit 1
          fi
          digest=${ref##*@}
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::DEFAULT_IMAGE_REF is not a digest reference: $ref"; exit 1 ;;
          esac
          {
            echo "expected_ref=$ref"
            echo "expected_digest=$digest"
            echo "expected_build_id=$build_id"
          } >> "$GITHUB_OUTPUT"
          echo "pin: $ref (buildId $build_id)"

      - name: Log in to ghcr.io
        id: login
        env:
          # The built-in token, scoped by the `permissions:` block above. No PAT.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Build → DF2.9 license sweep over the exported filesystem → credential
      # scan → push. The script owns every gate; this workflow owns the pin.
      # Exit codes mirror scripts/build-image.ts: 0 clean, 1 compliance
      # failure, 2 fatal before the sweep could conclude.
      #
      # REPRODUCIBILITY needs no buildx setup step here, deliberately. The
      # script creates its own `qds-repro` docker-container builder and passes
      # `rewrite-timestamp=true` and `--provenance=false --sbom=false` itself.
      # Duplicating any of that as a `setup-buildx-action` step would give the
      # gate below two sources of truth to disagree about.
      #
      # What IS passed from here, and only from here, is the SOURCE REVISION:
      # `SOURCE_DATE_EPOCH` and `QDS_GIT_SHA` are the two digest inputs that
      # would otherwise default to HEAD inside the script. Both are honoured by
      # the script as documented env overrides (`sourceDateEpoch()`,
      # `imageSourceSha()`), so a maintainer reproducing a published digest
      # locally sets the same two values and gets the same bytes.
      #
      # The guarantee is therefore "the same image source revision, built with
      # the same tag, yields the same digest" — which is exactly what the gate
      # below compares, and exactly what makes a re-run after a pin-adoption
      # commit pass instead of printing a new pin.
      - name: Build and push
        id: publish
        env:
          TAG: ${{ steps.src.outputs.tag }}
          SOURCE_DATE_EPOCH: ${{ steps.src.outputs.source_epoch }}
          QDS_GIT_SHA: ${{ steps.src.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR"
          bun scripts/build-exedev-image.ts \
            --tag "$TAG" \
            --platform linux/amd64 \
            --push \
            --summary "$BUILD_DIR/sweep-summary.json" \
            --evidence "$BUILD_DIR/publish-evidence.json"

      # ghcr answers bad or insufficient credentials with 403, NOT 401. Left
      # unexplained, the first failure reads as a missing repository and sends
      # whoever is on call looking for a typo in the image path. Named as a
      # prerequisite in DF2.10's Infra Prerequisites table for exactly that
      # reason, so the message is printed rather than assumed known.
      - name: Classify a registry failure
        if: failure() && (steps.login.outcome == 'failure' || steps.publish.outcome == 'failure')
        run: |
          echo "::error::registry step failed — read this before assuming a bad image path."
          cat <<'EOF'
          ghcr.io returns 403 Forbidden, NOT 401 Unauthorized, for bad or
          insufficient credentials. A 403 here means one of:

            * the workflow `permissions:` block lost `packages: write`;
            * the package ghcr.io/biospark33/qds-exedev exists and is owned by
              a different account, so GITHUB_TOKEN cannot write to it;
            * the package's "Inherit access from repository" setting was
              turned off and this repository was not re-added as a writer
              (Package settings -> Manage Actions access).

          It does NOT mean the repository or image path is missing. A genuinely
          absent repository also answers 403 on ghcr, which is why the two are
          indistinguishable from the status code alone.
          EOF
          exit 1

      # THE GATE (AC1). Everything above this point proves the image built and
      # pushed; only this proves it is the image the repo pins. A test that
      # asserts docker build and docker push exited 0 proves the image exists
      # and nothing about what production will boot.
      - name: Assert pushed digest and buildId equal the repo pin
        env:
          TAG: ${{ steps.src.outputs.tag }}
          SOURCE_SHA: ${{ steps.src.outputs.source_sha }}
          EXPECTED_REF: ${{ steps.pin.outputs.expected_ref }}
          EXPECTED_DIGEST: ${{ steps.pin.outputs.expected_digest }}
          EXPECTED_BUILD_ID: ${{ steps.pin.outputs.expected_build_id }}
        run: |
          set -euo pipefail
          # Read back from the REGISTRY, not from the local daemon: the local
          # image id is not the manifest digest, and a push that silently
          # converted the manifest would still match a local check.
          #
          # `--format '{{.Manifest.Digest}}'` is the obvious spelling and is a
          # TRAP: on Docker 28.4.0 imagetools SILENTLY IGNORES that template and
          # prints its multi-line human report instead, so this gate would have
          # compared a paragraph against a digest and failed every run for a
          # reason that reads as "the pin is wrong". `{{json .Manifest}}` is
          # honoured; jq lifts the field, and the shape is asserted below so a
          # future regression here goes red as itself rather than as a mismatch.
          # Same measurement, same conclusion as `manifestDigest()` in
          # scripts/build-exedev-image.ts — one trap, documented in both places
          # that step in it.
          actual_digest=$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}' | jq -er .digest)
          case "$actual_digest" in
            sha256:*) ;;
            *) echo "::error::imagetools returned no usable digest for $TAG: [$actual_digest]"; exit 1 ;;
          esac

          # Pull BY DIGEST, so the marker read below comes from the exact bytes
          # that were pushed rather than from whatever the tag resolves to now.
          docker pull --quiet "$IMAGE@$actual_digest"

          # linux/amd64 or nothing: exe.dev boxes are x86_64. Asserted, not
          # trusted to the runner's architecture.
          platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE@$actual_digest")

          # The baked marker is the only thing a box can read to state what it
          # booted (INV-IBOX-2) — it cannot carry its own digest, because the
          # digest hashes the manifest that contains it. `--entrypoint cat`
          # sidesteps the image's `init` entrypoint; nothing is supervised here.
          marker=$(docker run --rm --entrypoint cat "$IMAGE@$actual_digest" /etc/qds-image.json)
          actual_build_id=$(printf '%s' "$marker" | jq -er .buildId)
          actual_git_sha=$(printf '%s' "$marker" | jq -er .gitSha)

          echo "pushed  : $IMAGE@$actual_digest"
          echo "buildId : $actual_build_id"
          echo "platform: $platform"
          echo "gitSha  : $actual_git_sha"

          fail=0
          [ "$platform" = "linux/amd64" ] || { echo "::error::image is $platform, must be linux/amd64"; fail=1; }
          # The marker must record the SOURCE revision this run resolved. If it
          # records HEAD instead, the script stopped honouring QDS_GIT_SHA and
          # the pin gate has quietly gone back to never converging — a failure
          # that would otherwise present only as "the digest moved again".
          if [ "$actual_git_sha" != "$SOURCE_SHA" ]; then
            echo "::error::the marker's gitSha is $actual_git_sha, not the image source revision $SOURCE_SHA."
            echo "QDS_GIT_SHA was not honoured by scripts/build-exedev-image.ts (imageSourceSha())."
            echo "Until that is fixed the digest tracks HEAD and this gate can never pass twice."
            fail=1
          fi
          if [ "$actual_digest" != "$EXPECTED_DIGEST" ] || [ "$actual_build_id" != "$EXPECTED_BUILD_ID" ]; then
            echo "::error::pushed image does not match the repo pin."
            echo "  expected digest  : $EXPECTED_DIGEST"
            echo "  actual   digest  : $actual_digest"
            echo "  expected buildId : $EXPECTED_BUILD_ID"
            echo "  actual   buildId : $actual_build_id"
            echo ""
            echo "The image IS published at the actual digest above. To adopt it,"
            echo "replace the two constants in $DRIVER with exactly these lines,"
            echo "commit, and re-run this workflow:"
            echo ""
            echo "  export const DEFAULT_IMAGE_REF = \"$IMAGE@$actual_digest\";"
            echo "  export const DEFAULT_IMAGE_BUILD_ID = \"$actual_build_id\";"
            echo ""
            echo "That commit touches only $DRIVER, which is not part of the image"
            echo "source tree ($SOURCE_SHA), so the re-run rebuilds these exact bytes"
            echo "and this gate goes green. If it prints a THIRD digest instead, the"
            echo "build is not reproducible — do not keep re-pinning, fix that."
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "digest and buildId match the pin ($EXPECTED_REF)"

      # AC4's public-by-default half, proven rather than asserted. GHCR creates
      # a package PRIVATE on first push; flipping it to Public is a one-time
      # manual step (Package settings -> Change visibility). Until that happens
      # every customer pull fails — with a 403, so it reads as a missing repo.
      # This step catches that here instead of in a customer's mirror job.
      - name: Assert the package is anonymously pullable
        env:
          SOURCE_SHA: ${{ steps.src.outputs.source_sha }}
        run: |
          set -euo pipefail
          # An anonymous token request always succeeds; what it grants is what
          # differs. A public package hands back a token that reads manifests.
          token=$(curl -fsSL "https://ghcr.io/token?scope=repository:${IMAGE_PATH}:pull&service=ghcr.io" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${IMAGE_PATH}/manifests/sha-${SOURCE_SHA}")
          if [ "$code" != "200" ]; then
            echo "::error::anonymous manifest read returned HTTP $code — the package is not public."
            echo "ghcr answers 403 (not 401) here, so a customer's first pull will look"
            echo "like a missing repository. Fix it at:"
            echo "  https://github.com/users/biospark33/packages/container/qds-exedev/settings"
            echo "  -> Danger Zone -> Change visibility -> Public"
            echo "The whole no-pull-credential design (AC4, INV-IBOX-3) rests on this."
            exit 1
          fi
          echo "anonymous pull OK — no registry credential is needed on the production path"

      # `if: always()`, mirroring ci.yml's "Upload sweep summary": the sweep
      # summary and evidence are most wanted on the runs that FAILED. The
      # NOTICE has no CLI flag of its own, so the whole build dir is collected
      # rather than named paths.
      - name: Upload sweep summary, NOTICE and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exedev-image-publish-${{ github.sha }}
          path: oci/exedev/.build/
          if-no-files-found: warn

  # THE PROVENANCE THE BUILD GAVE UP, RESTORED OUT OF BAND — IN ITS OWN JOB.
  #
  # Why a separate job rather than three more steps on `publish`: GitHub grants
  # `permissions:` per job, and `id-token: write` puts ACTIONS_ID_TOKEN_REQUEST_
  # TOKEN into the environment of EVERY step in that job — including
  # `bun install`, which executes lifecycle scripts from the whole dependency
  # tree, and the Dockerfile build. Any of that code could mint an OIDC token
  # Fulcio would bind to "this repository, this workflow" and sign an artifact
  # nobody built here. Splitting the jobs is what actually removes that reach;
  # the ordering of steps within one job never did.
  #
  # This job therefore does NOT check out the repo, does NOT install
  # dependencies, and runs no project code at all. Its only inputs are two
  # strings from `publish`'s outputs, and it re-reads the registry itself.
  attest:
    needs: publish
    runs-on: ubuntu-latest
    # No build here — a registry read, a signature and two verifications.
    timeout-minutes: 15
    permissions:
      contents: read
      # Writes the sigstore bundle to ghcr as an OCI referrer beside the image.
      packages: write
      # Mints the short-lived OIDC token Fulcio exchanges for a certificate.
      # There is no key material to leak because there is no key.
      id-token: write
      # Files the resulting bundle in this repository's attestation store.
      attestations: write
    env:
      TAG: ${{ needs.publish.outputs.tag }}
      EXPECTED_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Sign nothing that has not been re-verified IN THIS JOB. `publish`
      # proved pushed == pinned, but that was a different job on a different
      # runner, and `cancel-in-progress: false` means a queued second publish
      # can land between the two. Re-reading the TAG here is the check that
      # catches it: if another run rewrote the tag, this refuses rather than
      # signing an artifact this pipeline never gated.
      - name: Revalidate the published digest before signing
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_DIGEST" ] || [ -z "$TAG" ]; then
            echo "::error::the publish job produced no tag/digest outputs — refusing to attest a blank subject."
            exit 1
          fi
          manifest=$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}')
          before=$(printf '%s' "$manifest" | jq -er .digest)
          kind=$(printf '%s' "$manifest" | jq -er .mediaType)
          echo "before attestation: $before ($kind)"
          if [ "$before" != "$EXPECTED_DIGEST" ]; then
            echo "::error::$TAG resolves to $before, not the gated digest $EXPECTED_DIGEST."
            echo "Something moved the tag between the publish job and this one (a concurrent"
            echo "publish, or a manual push). Refusing to sign an unreviewed artifact."
            exit 1
          fi
          if [ "$kind" != "application/vnd.oci.image.manifest.v1+json" ]; then
            echo "::error::$TAG is a $kind, not a single image manifest, BEFORE any attestation ran."
            exit 1
          fi

      # A sigstore bundle is stored as an OCI REFERRER: a separate manifest,
      # under its own `sha256-<digest>` tag, that merely NAMES the image digest
      # in its `subject` field. The image manifest bytes are never rewritten,
      # and the digest IS the hash of those bytes, so it cannot move. That is
      # asserted immediately below rather than argued.
      #
      # Deliberately not cosign: the signing identity (Fulcio), the transparency
      # log (Rekor) and the bundle format are the same sigstore machinery either
      # way, and this action needs no installer step, no key material, and no
      # secret — the OIDC token minted by `id-token: write` is the whole
      # credential. A cosign-installer step plus `cosign attest` would be more
      # moving parts for the same artifact.
      #
      # SHA-pinned, unlike the tag-pinned actions in the `publish` job and
      # ci.yml. Not inconsistency for its own sake: this is the only job in the
      # repository holding `id-token: write`, so a hijacked mutable tag here
      # yields a valid Fulcio certificate for this repository rather than a
      # broken build. Dependabot's github-actions entry maintains SHA pins the
      # same way it maintains tags, so the pin does not go stale silently.
      - name: Attest build provenance for the pushed image
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          # The gate in `publish` already proved pushed == pinned and the step
          # above re-proved it here, so the pin IS the pushed digest. Signing
          # the PIN rather than a fresh read-back makes it structurally
          # impossible for this step to attest an artifact no gate saw.
          subject-digest: ${{ env.EXPECTED_DIGEST }}
          # Store the bundle beside the image in ghcr as well as in GitHub's
          # attestation store. The referrer is the copy that survives a
          # `crane copy` into a customer's own registry — the mirror path AC4's
          # public-source-image decision is built around, where GitHub's API is
          # commonly unreachable. Registry credentials come from the docker
          # login above; the action reads them from the docker config.
          push-to-registry: true

      # THE LOAD-BEARING ASSERTION OF THIS FOLLOW-UP. "Out of band" is a claim
      # about a digest, so it is checked as one.
      #
      # Read back BY TAG, never by digest: `imagetools inspect <image>@<digest>`
      # returns the digest it was handed, which would make this step a tautology
      # that passes even if the tag had been rewritten into an attestation
      # index. Inspecting the TAG asks the only question that matters — what
      # does a puller resolve now, after the attestation was pushed?
      #
      # The media type is asserted for the same reason and is the sharper half:
      # the failure mode being guarded against is precisely "the artifact became
      # an INDEX", which is what the disabled in-band attestation did. An index
      # here would move the digest AND change this field, and either alone goes
      # red.
      - name: Assert the attestation did not move the image digest
        run: |
          set -euo pipefail
          manifest=$(docker buildx imagetools inspect "$TAG" --format '{{json .Manifest}}')
          after=$(printf '%s' "$manifest" | jq -er .digest)
          kind=$(printf '%s' "$manifest" | jq -er .mediaType)
          echo "after attestation: $after ($kind)"
          fail=0
          if [ "$after" != "$EXPECTED_DIGEST" ]; then
            echo "::error::the attestation MOVED the published digest — it is in-band, and the pin is now stale."
            echo "  before (pinned) : $EXPECTED_DIGEST"
            echo "  after  (tag)    : $after"
            echo "An attestation that perturbs the artifact it describes is the exact thing"
            echo "--provenance=false was set to avoid. Do not re-pin to make this pass:"
            echo "re-pinning adopts an artifact no review saw and hides the regression."
            fail=1
          fi
          if [ "$kind" != "application/vnd.oci.image.manifest.v1+json" ]; then
            echo "::error::$TAG is a $kind, not a single image manifest — the attestation was attached in-band."
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "digest unchanged and still a single image manifest — the attestation is out of band"

      # Produced is not verified. Both stores are checked because they fail
      # INDEPENDENTLY and are reached by different consumers: the default lookup
      # goes to GitHub's attestation API (what `gh attestation verify` and most
      # policy engines use), while `--bundle-from-oci` reads the referrer that
      # travels with the image into a tenant registry. A push that silently
      # wrote only one of them would otherwise look green.
      #
      # The identity is pinned as tightly as the flags allow, because a
      # provenance check that accepts "signed by anything in this org" attests
      # to nothing: `--repo` binds the source repository, `--signer-workflow`
      # binds THIS workflow file (rename it and this must be revisited, which is
      # the point), and `--deny-self-hosted-runners` refuses a bundle minted
      # anywhere but GitHub-hosted infrastructure. The default predicate type is
      # already the SLSA v1 provenance we want, asserted here rather than left
      # implicit.
      - name: Verify the attestation against the published digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNER: ${{ github.repository }}/.github/workflows/publish-exedev-image.yml
        run: |
          set -euo pipefail
          for source in github oci; do
            args=("oci://$IMAGE@$EXPECTED_DIGEST"
              --repo "$GITHUB_REPOSITORY"
              --signer-workflow "$SIGNER"
              --predicate-type https://slsa.dev/provenance/v1
              --deny-self-hosted-runners)
            # An `if`, not `[ … ] && args+=(…)`: under `set -e` a false test as
            # the last command of a compound statement exits the step, so the
            # terse spelling would abort the loop on its FIRST (github) pass and
            # read as a verification failure.
            if [ "$source" = "oci" ]; then args+=(--bundle-from-oci); fi
            # Bounded retry, and NOT a soft failure. GitHub's attestation API is
            # eventually consistent — a bundle filed seconds earlier can read
            # back empty on the first try — and a publish that goes red over a
            # propagation artifact costs a full QEMU rebuild to retry. Five
            # attempts over ~40s is the ceiling; past it the attestation
            # genuinely is not there and the step fails, which is the outcome
            # that must not be papered over.
            ok=0
            for attempt in 1 2 3 4 5; do
              echo "verifying from $source (attempt $attempt)…"
              if gh attestation verify "${args[@]}"; then ok=1; break; fi
              if [ "$attempt" -lt 5 ]; then sleep 10; fi
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::the attestation did not verify from $source after 5 attempts."
              echo "This is not a flake budget being exceeded — it means the image at"
              echo "$EXPECTED_DIGEST carries no provenance a consumer could check."
              exit 1
            fi
          done
          echo "attestation verifies from BOTH the GitHub store and the ghcr referrer"
