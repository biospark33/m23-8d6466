# F099: every runtime dep floats on a caret range with nothing surfacing CVEs or
# upstream releases. The policy side already exists — the license sweep in the
# `image` CI job fails on a denied package, and the repo ships a qds-dependabot
# skill for triaging these in bulk. This is the input that exercises both.
#
# Grouped + MONTHLY on purpose: one PR per ecosystem per month, not one per
# package. Majors stay ungrouped so a breaking bump arrives on its own PR.
#
# Weekly until 2026-09: with four ecosystems that is up to ~8 PRs/week, each
# one a full 9-minute CI run on a private repo's metered minutes, and the npm
# and docker ones also trip the `image` job's OCI build (package.json /
# bun.lock / oci/** are exactly the paths ci.yml gates that job on). Monthly
# cuts that ~4x. What it does NOT slow down is the thing the cadence is
# actually for: dependabot SECURITY updates ignore `schedule` entirely and
# open a PR the moment an advisory lands. `interval` only paces the routine
# "a newer version exists" sweep. The upstream-rebuild early warning for the
# exedev base likewise does not depend on this file — the `base-drift` job in
# verify-image-pin.yml resolves that tag DAILY (see the /oci/exedev entry).
version: 2
updates:
  # ONE npm entry, not three. `visualizer` and `cli-anything` are bun workspaces
  # of the root package.json with no lockfile of their own (the only bun.lock is
  # at the root), so dependabot's workspace support is EXPECTED to update their
  # manifests from this entry — not verified here. If member manifests never get
  # bumped, add per-directory entries for `/visualizer` and `/cli-anything`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Pins in ci.yml (actions/checkout@v7, oven-sh/setup-bun@v2, …).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]

  # The F084 base-image digest in oci/Dockerfile — see the bump procedure there.
  - package-ecosystem: docker
    directory: /oci
    schedule:
      interval: monthly

  # DF2.10: the `ghcr.io/boldsoftware/exeuntu` base digest in
  # oci/exedev/Dockerfile — the factory boot image's own base. A SECOND entry
  # and not a second `directories:` value on the one above, because the two
  # track unrelated bases on unrelated tiers (D7's node runtime vs the exe.dev
  # boot substrate) and a shared PR would couple their review.
  #
  # Upstream rebuilds exeuntu weekly on a no-cache cron, so the digest moves
  # under a tag that does not. A digest-bump PR here is the INTENDED
  # early-warning signal — the same role the /oci entry plays for the F084 node
  # base. Landing one is not a formality: the bumped base must be rebuilt,
  # re-swept and re-published, and the digest pin in
  # src/providers/exedev/driver.ts moved to the new digest, or the publish
  # workflow's pin gate fails on the next run.
  #
  # NO LONGER DORMANT (DF1.10, #186 item 9). This entry could not open a PR
  # while oci/exedev/Dockerfile pinned the base as
  # `ghcr.io/boldsoftware/exeuntu@sha256:…` with NO tag: dependabot's docker
  # updater derives the stream to follow from the tag, and a bare digest gives
  # it nothing to compare against. The sibling /oci entry always worked because
  # oci/Dockerfile writes `node:22-bookworm-slim@sha256:…`, tag AND digest. The
  # one-token fix — `exeuntu:latest@sha256:…`, which resolves to the same image
  # — changes the Dockerfile bytes and therefore the buildId and the published
  # digest, which is exactly why it had to ride a deliberate re-pin rather than
  # land on its own. It rode DF1.10's.
  #
  # THE `base-drift` JOB STAYS. It is the daily leg in
  # .github/workflows/verify-image-pin.yml that resolves
  # `ghcr.io/boldsoftware/exeuntu:latest` anonymously and fails when it no
  # longer equals the digest pinned in oci/exedev/Dockerfile. It is now
  # belt-and-braces for the routine digest bump — but it catches one thing
  # dependabot does not, a RETAG of the same version stream, and it runs daily
  # where this entry runs monthly. Deleting it would trade a one-day detection
  # window for a one-month one.
  #
  # THE HALF-AUTOMATED STEP, NAMED. Merging one of these PRs edits
  # oci/exedev/Dockerfile — both a `paths:` trigger and a buildId input — so
  # publish-exedev-image.yml rebuilds and publishes a new digest, and the
  # workflow goes GREEN. But oci/exedev/Dockerfile's own header states that a
  # moved digest ALSO requires re-pushing
  # `ghcr.io/quantum-digital-solutions/qds-exedev-private`, and NOTHING in
  # either workflow does that. The failure lands later and somewhere else: a
  # green publish, then a red AC4 live test reading "manifest unknown", from a
  # bot-authored PR, with nothing pointing at the missing mirror push.
  #
  # Automating the mirror push is the RIGHT fix and it is deliberately not made
  # here: it is a real pipeline change (a second registry, a second set of
  # credentials, a second signature) and it needs its own verification round
  # rather than riding a review pass on an unrelated story.
  #
  # What is done instead is the conservative half — make a bot PR impossible to
  # land absent-mindedly. The label is the marker a human sees on the PR list
  # and the reason it is not just a comment in this file, which nobody reads at
  # merge time. There is no auto-merge automation in this repo today (no
  # workflow calls `gh pr merge`), so nothing can land one of these without a
  # human clicking; the label is what tells that human there is a second step.
  # If auto-merge is ever added, EXCLUDE this label from it.
  - package-ecosystem: docker
    directory: /oci/exedev
    schedule:
      interval: monthly
    labels:
      - dependencies
      - manual-mirror-push-required
