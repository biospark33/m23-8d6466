# QDS Factory default per-role model roster (DF1.5).
#
# One entry per role over a roster-wide `defaults` block. The merge is a shallow
# setdefault: a per-role value always wins, and a per-role `tools` list REPLACES
# the defaults list rather than extending it.
# M2.2: the worker role grants the kg-recall extension (registers `kg_recall`;
# that role's `tools` must stay null or name it — see the worker block below).
#
# F097: these slugs are NOT verified automatically. `bun run check:roster`
# (= `bun scripts/roster-check.ts --roster config/rosters/qds-default.roster.yaml`)
# puts each resolved (provider, model) pair through pi's merged catalog AND
# OpenRouter's live model list and refuses a slug that clears only one — but the
# pi-catalog half needs the `pi` binary with a provider credential configured
# (`pi --list-models`), which CI has neither of. (The OpenRouter models endpoint
# itself is public and needs no key — the key is what makes pi LIST the
# openrouter slugs at all, per the note below.) So this is a MANUAL /
# dispatch-time preflight, not a gate. Run it by hand after editing this file and
# before any run that matters. Nothing here is "proven live" until you do.
#
# OpenRouter is the working provider path on this host; direct-Anthropic routing
# is not used (its OAuth expired ~2026-02-25). Note that `provider` is
# authoritative: `anthropic/claude-haiku-4.5` below is an OpenRouter MODEL ID
# whose first segment happens to name a vendor — it is not split.
#
# The pi catalog gate only lists a provider's models once that provider's
# credential is visible to pi, so run roster-check with OPENROUTER_API_KEY set
# (or pi's own auth configured). Without it the catalog gate reports the
# openrouter slugs as absent rather than passing them by omission.

defaults:
  provider: openrouter
  thinking: medium
  # null = every tool usable. A role that narrows this must also name any tool
  # its `harness_engineering` extensions register, or that tool is filtered out.
  tools: null
  # [] = no repo writes. Roles that need to write narrow it to a path list.
  writes: []
  harness_engineering: []

roles:
  - name: planner
    model: anthropic/claude-haiku-4.5
    thinking: high

  - name: worker
    model: deepseek/deepseek-v3.2
    # self-compact registers `self_compact` / `view_context`; `tools` must stay
    # null (the default) or name those tools, or pi's --tools filter silently
    # drops them (roster/schema.ts warns when harness_engineering meets a
    # non-null allowlist).
    # kg-recall registers exactly one tool `kg_recall` (recall-only, read-only);
    # same rule: `tools` must stay null or name `kg_recall`, or pi's --tools
    # filter silently drops it.
    writes: ["src/", "tests/", "scripts/"]
    harness_engineering:
      - pi-vs-claude-code-vendor/self-compact/extensions/self-compact/self-compact.ts
      - pi-vs-claude-code-vendor/kg-recall/extensions/kg-recall/kg-recall.ts
    compaction:
      soft_at: "30%"
      at: "50%"
      buffer: "10%"

  - name: reviewer
    model: qwen/qwen3-30b-a3b-instruct-2507
    thinking: low
    tools: ["read", "grep", "bash"]
