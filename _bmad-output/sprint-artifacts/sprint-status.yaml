serted; delivered.add ran before ack with the ack throw swallowed, so a failed ack was never retried and fleet attach reported not-acked for a message that landed; telemetry.status is a one-way latch that gated the drain, so one degraded resident silently stopped all steering delivery forever; the approver allowlist dir-mode guard checked only ONE ancestor (the documented attack one level up still worked) and had no ownership check; an attach append failure exited 1 "retry me" which mints a new messageId = DOUBLE DELIVERY; legacy singular supersededReportId was unreadable, unwritable AND unremovable (two disagreeing sources of truth in an audit trail); STRINGS_MAX_ELEMENTS bricked every write past 256 rebinds. Deviation 10 recorded (AC5 attach refusal is a documented race, not an invariant). Gates: 4090 pass / 0 fail (4134 tests, 133 files), tsc 0, biome clean over 266 files, detect_changes blast radius inside the story's own modules (assertWritable/provisionAdmittedRun surface only because they share run-record.ts — verified untouched by the PR). GitNexus index is stale/corrupted for this branch (new files absent, garbage symbol names) — impact analysis fell back to grep; reindex owed. REVIEW ROUND 7 2026-08-30 (bmad-code-review, 11 reviewers over 11 chunked diffs; 43 raw -> 37 unique; 7 parallel fixers): 33 patches + 1 conservative decision, 5 false positives dismissed, 0 deferred. HIGH: acquire-side lock-reclaim rename-vacancy race (restore now renames the very file back, inode-preserving); runner minted a fresh reverifyId per retry so the pausing-resume arm could never fire and a crashed pause stranded the run permanently (bound reportId now re-presented; resume restamps requestedAt/expiresAt and re-checks the bundle); --rotate was a dead flag with unactionable remediations (now passed through, subprocess-proven). Deviation 8's bundle guard was dead code — now wired through recordApprovalPort and its story text corrected. Deviation 11 recorded (fleet status show