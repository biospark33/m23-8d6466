phase5_adversarial_review:
  reviewer: R7-decisions
  scope: "landed W3-A/B/C only; approval-gate.ts and reverify/approval.ts excluded as in-flight"
  findings_real: 4
  hunts_verified_clean: 6
  state_yaml_contradictions_found: 0   # in the reviewable surface; D3/R5B/D4 live in approval-gate.ts, unverified
  F1:
    severity: DESIGN
    site: "src/phase-engine/steering.ts:385-387"
    defect: >
      The steering channel FAILS OPEN TO SILENCE. attach.ts:256-259 deliberately distinguishes
      ENOENT (return [], nothing queued) from a real read error (throw - EACCES/EIO/EISDIR).
      drainInbox's outer `catch { /* sidecar */ }` discards that distinction: BOTH become
      "no messages", with no log, no tripwire, no telemetry.
    consequence: >
      Makes an operator-facing guarantee FALSE. attach.ts:235-237 says "the message stays queued -
      neither dropped nor re-sent". If the inbox becomes unreadable, the message will NEVER be
      delivered on any later solicitation because the read fails every time - while the only signal
      the operator gets says "retry later" and nothing records that the channel is broken.
    note: "deps.onTripwire already exists in scope (createSteering:278) and is unused here."
    reviewer_insight: "'To catch it a test must assert something observable - and there IS nothing observable to assert. That absence is the defect.'"
  F2:
    severity: SECURITY
    site: "src/fleet/approvers.ts:148"
    defect: "The FILE mode is checked; the containing DIRECTORY mode is not. This is the authorization boundary for the entire gate."
    scenario: >
      .factory/ at 0777 (or attacker-owned) with approvers.json at 0600 owned by the operator.
      Any local account runs `mv evil.json .factory/approvers.json` - 0600, schema-valid, enrolling
      their own {salt,hash}. Both the mode check and the zod schema pass. The attacker can now
      authorize PRs. The 0600 file check contributes NOTHING in that configuration.
    honest_framing: "NOT newly introduced - mirrors src/pr/repos.ts:95-108's identical gap. But RunRecordStore sets the in-repo precedent for the fix (run-record.ts:818-822 asserts its dir is 0700 and refuses)."
    out_of_scope_sibling: "src/pr/repos.ts:95-108 has the SAME gap in DF5.2's repo allowlist. Different owner - raise as a separate story, do NOT fix here."
  F3:
    severity: DESIGN
    site: "src/providers/run-record.ts:754,761"
    defect: "set() returns a record ALIASING the caller's array. `entry[field] = value` stores by reference while EXISTING values are structuredCloned. Every prior extension value was a primitive, so this never mattered until `strings`."
    empirically_confirmed: >
      const ids = ["rv-1"]; const rec = store.set(...supersededReportIds: ids); ids.push("MUTATED");
      => rec...supersededReportIds is ["rv-1","MUTATED"] while DISK is ["rv-1"]. Identity check: true.
    scenario: "W4's rebind builds [...prior, displaced] and HOLDS it; any later mutation silently desynchronizes the returned record from disk - in an approval audit trail."
    fix: "[...value] at the assignment. The existing test asserts the OTHER direction (store does not mutate the caller's array) and passes - it does not cover this one."
  F4:
    severity: EDGE_CASE
    site: "src/fleet/attach.ts:188-194"
    defect: "TOCTOU on the not-attachable check. State read at :189, append fires at :208, under NO lock, while the approval gate mutates that same state under withApprovalLock."
    consequence: "A run entering `pausing` in that window gets a message appended to a box being torn down. Bounded: one lost steering message, no state corruption."
    story_deviation: "AC5 words the refusal as an INVARIANT; it is a RACE. Recording as a deviation rather than locking - the consequence does not justify a lock on the attach path."

  pre_existing_NOT_worsened:   # recorded, deliberately not fixed
    - "run-record.ts:754 READ arm never scans, so a secret already on disk is re-written unscanned by any later set(). Pre-existing read/write split."
    - "mkdirSync/appendFileSync `mode` is ignored when the path already exists, so a pre-existing wider /run/steering is never narrowed (no assert, unlike RunRecordStore)."

  verified_clean_with_reasons:
    shellQuote: "Applied to EVERY interpolated value on every path - appendScript quotes both dirname and path, readAck quotes acksPath. QDS_STEERING_ROOT containing a quote, space, newline or $(...) is INERT; the quoter's '\\'' escape is correct POSIX. No unquoted interpolation exists."
    strings_bounds_merged_vs_incoming: "SAFE for the RIGHT reason - validateExtensions is per-field REPLACE, not append, so the merged result IS the incoming array and assertKind sees all of it. '200 existing + 100 new' cannot slip past; the caller must pass all 300. Exactly 256 and exactly 200 pass; 257/201 refuse, both sides asserted."
    assertNoSecret_reachability: "The recursion is on the ONLY extension write path (validateExtensions write arm :761). Nested arrays are rejected by assertKind BEFORE it. ports outcome byte-identical."
    attach_poll_loop: "No double-count (one increment per tick); an empty acks file returns 'absent' not 'unusable' - correct, that is latency not corruption; early exit only via the ceiling or 3 consecutive unusable ticks."
    zero_600_window: "CLEAN on the host leg - `umask 077` PRECEDES `mkdir -p` in the same sh -c, so the directory is 0700 and the file 0600 from creation with no widening window."
    allowlist_shapes: "array/string/null/nested all fail the .strict() schema; empty approvers:{} authorizes nobody; Object.hasOwn blocks __proto__/constructor. Symlink: statSync FOLLOWS, so a symlink pointing at a 0644 file is refused on the TARGET's mode. Correct."

