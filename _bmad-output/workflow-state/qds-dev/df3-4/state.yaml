cli_contract_settled:   # R3b, definitive
  exit_codes_declared:
    approve: [0,1,2,4,5,6]
    reject:  [0,1,2,4,5,6]
    attach:  [0,1,2,4,5,6]
    rationale: >
      Identical to harvest/teardown. NO 3 for any of them (3 is dispatch-only, dispatch.ts:2580/2596/2680).
      There is no exit 7 (grepped). 6 is MANDATORY even for attach: finish() folds an EAGAIN-refused
      stdout into 6 for EVERY verb returning 0 - which is exactly why rank declares 6 (verbs.ts:170-174).
  exit_6_cannot_be_thrown: >
    LOAD-BEARING. FleetError's ctor is exitCode: 1|2|3|4|5 (dispatch.ts:207). 6 only ever arrives
    via a `code = 6` assignment or finish()'s fold (fleet.ts:1264). Do not try to throw it.
  code_6_taxonomy_note_is_stale: >
    verbs.ts:72-78's unresolved NOTE is ALREADY resolved in fleet.ts's header, which explicitly
    enumerates "stdout refused part of the output" as a 6. Adopt the header; do not re-litigate.
  token_mismatch_is_5_not_2: >
    Both classify as `logic`, but 2's default remediation is HELP (the flag list), and a flag list
    is not the remediation for a bad token. Same argument asUsage makes at fleet.ts:436-438.
  driver_flag:
    approve_reject: >
      NO --driver. The assertDriverChosen hazard (fleet.ts:267-280: teardown "destroying" a FAKE
      box while the real one bills) is structurally unreachable for a verb touching one record's
      extensions.approval. `rank` is the precedent: flag ABSENT from the entry, NOT required:false
      (verbs.ts:16-21 - a required:false --driver is "how DF3.5 would generate a skill whose every
      call exits 2"), and NO assertDriverChosen call. Mirror rank's comment at fleet.ts:2056-2058.
      Flips only if approve ever resumes/re-provisions - which per R7 it never does.
    attach: "YES, required. Call assertDriverChosen at the TOP of the verb before any store construction, per fleet.ts:2331."
  stdin_token_guard: >
    COPY THE PREDICATE, INVERT THE BRANCH. assertOneBriefSource (fleet.ts:867-879) asks "was a
    SECOND source attached?"; approve asks "was a TOKEN attached?". Same set, opposite verdict:
    chardev/socket/EBADF => NO token => refuse exit 2; fifo/regular-file => deliberate attachment
    => read it. Use fstat(0), never isTTY. Reuse readCappedStdin's SHAPE but not its constants -
    64 KiB / 120 s are absurd for a token.
  constant_time_compare: "NONE exists in src/ or scripts/. Write our own, copying visualizer/server/auth.ts:83-87's digest-then-compare (sha256 both sides, then timingSafeEqual on fixed 32-byte digests). Do NOT import across visualizer/ <-> src/. Do NOT copy the vendored coms-core secretEqual - its early length-return leaks length."
  two_store_pattern: >
    approve/reject must copy harvest/teardown's TWO-STORE pattern (create:false probe -> getRecord
    -> THEN writable), fleet.ts:2349-2406 - NOT status's single store. A writable store has THREE
    side effects, not one: mkdirSync(0o700) + chmodSync(0o700) + mode assert, AND
    assertExclusiveCreateSupported(), AND cleanStaleTemps() (run-record.ts:815-824).
    approve/reject do NOT need the destructive lock mark.

