  # in the `decisions:` block below, which is the ONLY authority. Kept for provenance, not as
  # live state. If you are grepping this file top-down, do not stop here.
  ALL_RESOLVED_SEE_decisions_BLOCK: true
  BLOCKER_R5D_resume_ledger: >
    [ANSWERED - see decisions.BLOCKER_resume_ledger: RESOLVED-NOT-A-BLOCKER, R5 over-read it.]
    Original question: a resumed run re-provisioned under the same runId LOSES its second box's
    hours - boxHoursEventId keys on the frozen closedAt. Story never says whether resume gets a
    new runId. Money-loss path.
  HIGH_D1_superseded_array: >
    [ANSWERED - see decisions.D1_superseded_history. assertNoSecret did NOT walk arrays (that
    hole is now closed by recursion); DF5.3 does NOT need the history - DF3.4's own DoD at
    :345-347 is the binding requirement.]
