decisions:
  D1_superseded_history:
    ruling: "CONFIRMED by R7. Store the FULL ordered history as `supersededReportIds: \"strings\"`, ARRAY ONLY on the record, and DERIVE the singular at the DF5.1 seam."
    binding_requirement: >
      NOT DF5.3 - R7 established DF5.3's hop table (df5-3:120) carries only
      {approverId, decision, decidedAt}, with ZERO matches for superseded/rebind/reportId/
      reverifyId in the whole story. So df3-4:206-208's claim that the history is "for DF5.3's
      audit chain" OVERSTATES the downstream need. The array is required by DF3.4's OWN DoD at
      :345-347: "no finish with decision against reportId absent from both reportId and
      supersededReportIds" - a singular field cannot satisfy that after two rebinds.
      Consequence to record: nobody downstream is blocked if the array slipped to a follow-up.
    two_sources_of_truth: >
      Keeping BOTH fields is a real trap and the tree already shows it biting - approval.ts:218-223
      must EXPLICITLY clear the singular on a fresh request because set() deep-merges field-by-field.
      Two fields doubles that trap and a record whose scalar and array disagree is unfalsifiable,
      in an approval audit trail. So: array on the record, derive the singular at the seam.
      ApprovalOutcome (approval.ts:33-37) stays BYTE-IDENTICAL - {outcome:"rebound";
      supersededReportId: string} is a PER-CALL fact ("the id THIS rebind displaced"), so deriving
      is more correct than storing. Fresh request writes supersededReportIds: [] (the story's
      stated default, :206-207). No migration needed: the singular is written only by the adapter
      DF3.4 replaces, and old records still read fine via the lenient read arm.
    mandatory_companion_changes:   # 4 changes, ONE commit - R7 verified
      1_assertNoSecret_recursion: >
        NON-NEGOTIABLE. run-record.ts:529 line one is `if (typeof value !== "string") return;` -
        it DOES NOT walk arrays. Written when the only non-string was a ports NUMBER array
        (integers cannot be tokens). Widening ExtensionEntry to admit string[] turns that line
        into a hole: ["sk-live-..."] passes assertKind, reaches assertNoSecret, is written
        UNSCANNED - and INV-APPROVE-7 would be asserting an enforcement that no longer runs on
        this story's own new field. Fix is RECURSION (not .filter(isString)) so a mixed array
        still has its strings scanned and non-strings hit the existing early return one level down.
        Keeps the ports path byte-identical.
      2_assertKind_explicit_ports: >
        `ports` is currently the IMPLICIT ELSE (:581-583). Adding "strings" WITHOUT an explicit
        `if (kind === "ports")` sends every strings value into the array-of-INTEGERS check.
      3_ExtensionPatch_widen: "ExtensionPatch (:123) must widen too - it is the type on RunRecordPatch.extensions (:133)."
      4_bound_strings: >
        Bound element count AND per-element length on "strings". supersededReportIds grows by one
        per rebind, nothing caps it, and the record is re-read on every fleet status and every
        list() sweep. Story bounds proposal (8_000) and reason (1_000) at :243-245 and is SILENT
        here. Propose <=256 elements in assertKind's "strings" arm so the refusal is a schema
        rejection at the write, not a disk problem later. reverifyId is fixed-shape so a
        per-element length bound is free. supersededReportIds must NOT be SHAPE_EXEMPT.
    blast_radius: >
      GitNexus upstream (fresh index, includeTests): assertNoSecret 6 impacted/2 direct CRITICAL;
      assertKind 8/3 CRITICAL; validateExtensions 7/2 CRITICAL. Same six processes each
      (teardownRun, fleet run, requestApproval, run-record run, provisionAdmittedRun, reapRuns).
      CRITICAL reflects that these sit on EVERY record write - the change is purely ADDITIVE and
      leaves the number/ports path byte-identical. FieldKind/ExtensionEntry are type-only;
      ExtensionEntry's ONLY external importer is pr/open-pr.ts:23.
    read_site_audit: >
      NOTHING in src/ or scripts/ does Object.entries/values/for-in over an ExtensionEntry - the
      class of consumer that would break does not exist. All consumers read NAMED SCALARS and
      tolerate. JSON round-trip SAFE; the READ arm (:644) already accepts arrays unchanged today.
      scripts/run-record.ts applyExt (:95-114) CANNOT express an array - it sends a literal string
      and assertKind rejects with a named key. Fail-closed and honest; leave it.
      EXPECTED TEST CHURN: tests/reverify/approval.test.ts:62 and runner.test.ts:446,450 assert
      the singular RECORD field and must move to the array. approval.test.ts:57 asserts
      ApprovalOutcome and is UNCHANGED (that is the point of deriving).
    lock_now_load_bearing: >
      The array makes withApprovalLock load-bearing where the singular arguably tolerated a lost
      update. validateExtensions merges per field REPLACING the value (:621, :651) - there is NO
      append semantics - so "append the displaced id" is a read-modify-write across two calls
      that store.set's PID lock does NOT span. Two concurrent rebinds each read [a] and write
      [a,b]/[a,c]; one displaced id is lost, failing the story's own DoD at :345-347.
    gate_before_merge: "bun run typecheck (for pr/open-pr.ts:229 widened index signature), bun test tests/providers/run-record.test.ts tests/reverify/ tests/pr/, detect_changes({scope:'compare', base_ref:'dev'})"

  BLOCKER_resume_ledger:
    status: RESOLVED-NOT-A-BLOCKER   # R7 verified; R5 over-read it
    ruling: "No re-provisioning resume path exists in DF3.4. Nothing to do."
    evidence: >
      All 5 occurrences of "resume" in df3-4 mean COMPLETE-A-PAUSE; zero mean restart-a-run
      (:90, :106, :125, :200, :281). boxHoursEventId does key on frozen closedAt
      (cost-ledger.ts:285, used :1095, ON CONFLICT DO NOTHING; closedAt frozen by
      first-close-wins run-record.ts:1250-1254) so a second box WOULD collide in the abstract -
      but it is UNREACHABLE: provisioning writes vmName/ports/httpsUrl (core fields) and
      setLocked:1239 throws "record <id> is closed; core key not writable", which
      driver.ts:723-733 converts into a LOUD ProvisionRefusedError naming the live box.
      Not a silent money loss. No DF3.4-scoped verb provisions a box (R7 1(d), definitive).
    residual_not_ours: >
      The ledger can price at most ONE box per runId, ever. Correct for today's architecture.
      A future re-provision story must widen the ledger key; DF3.4 must not, and the DF3.4 spec
      must not be amended for it. Recorded so it is not rediscovered as a "blocker" a third time.

  D2_bundlePath:
    FINAL_RULING: "DO NOT store bundlePath at all. No field, no SHAPE_EXEMPT_PATHS entry. AC1(a2)'s rebind re-validation is an existsSync check instead."
    final_reasoning: >
      Settled by R4b/R8 with measured evidence after two reversals. Decisive facts:
      (a) DF2.5 ALREADY MADE THIS CALL, oppositely and explicitly - harvest.ts:18-19: "Harvest
          writes NOTHING to the run record: the bundle's presence at <runsDir>/<run-id>.bundle is
          the record, and DF2.1's schema stays closed." Registering the field REVERSES a stated
          invariant of a story DF3.4 does not own.
      (b) The value is HOST-DEPENDENT so the shape check is non-deterministic. harvest.ts:435-436
          is join(runsDir, runId+".bundle") with NO path.resolve in the chain - RELATIVE by
          default, absolute only when store.dir is. MEASURED:
          /Users/steve/QDS-Factory/.sandbox/runs/df34-a1b2c3.bundle THROWS (57 chars; uppercase
          from the U in /Users and QDS-F in the repo name; digits from the runId);
          /home/ci/qds-factory/.sandbox/... PASSES for ONE reason - no uppercase. So all-lowercase
          Linux CI goes green while this repo's own macOS checkout throws, and a digit-free runId
          flips it back. Three unrelated host properties silently deciding whether a write
          succeeds is a latent bug, not a field to exempt.
      (c) Derivable from runId + runsDir, so storing it is a second source of truth that goes
          stale when QDS_RUNS_DIR moves.
      (d) A host-absolute path in a DF5.3 audit artifact leaks the operator username and local
          directory layout and is meaningless on any other host.
    ac1a2_satisfied_by: >
      existsSync(join(resolveRunsDir(...), runId + ".bundle")) - STRICTLY STRONGER than comparing
      a stored string, because it proves the bundle is there NOW rather than that a string matches.
      Owned by the approval-gate wave.
    exemption_caveats_now_moot_but_recorded:
      - "The 201-char ceiling is BORROWED from REPO_SLUG_PATTERN's two 100-char segments - a slug grammar unrelated to paths - and is SHARED, so it could not be raised for bundlePath without loosening budget.repoSlug."
      - "SHAPE_EXEMPT_PATHS does NOT cover the SECRET_PREFIXES scan (loop runs before the exempt check), so a directory literally named sk-*/ghp_*/xoxb-* would throw even when exempt."
    superseded_rulings: "v1 do-not-register (right instinct, incomplete reason) -> v2 register+exempt (wrong, followed R7's shape) -> v3 FINAL do-not-store (right, with DF2.5's invariant as the decisive reason)."

  D2_superseded_v2:
    ruling: "SUPERSEDED - see D2_bundlePath FINAL_RULING above. NOTHING IN THIS ENTRY IS LIVE."
    # The prescription this entry once carried (add extPath("approval","bundlePath") to
    # SHAPE_EXEMPT_PATHS) has been DELETED rather than merely labelled, because a grep for
    # SHAPE_EXEMPT found the prescription and not the label. The shipped code adds NO exemption;
    # SHAPE_EXEMPT_PATHS holds its original three entries (keyHash, budget.repoSlug,
    # budget.issueId) and run-record.test.ts pins that bundlePath is NOT a registered field.
    what_this_reversal_was: >
      An intermediate ruling that registered bundlePath and exempted it from the shape heuristic.
      Reversed on three grounds: DF2.5's harvest.ts:18-19 invariant that harvest writes nothing to
      the record; the comparison being vacuous because harvest.ts:435-436 makes the path a pure
      function of the runId; and the one case it CAN fire being a false positive when QDS_RUNS_DIR
      moves. Retained only so the reversal history is legible.

  D3_locking:
    ruling: "Use withApprovalLock (src/reverify/approval.ts:87-174). NOT DF2.1's per-record PID lock."
    reasoning: >
      The story's stated lock is private inside RunRecordStore.set; DF5.1 Deviation 4 records
      that taking it externally deadlocks, and it blocks the event loop via Atomics.wait up to 5s.
      withApprovalLock is O_EXCL, 5s ceiling, 10ms poll, reclaims only on proof of death
      (kill(pid,0) -> ESRCH; EPERM must NOT reclaim), atomic claim via renameSync.
    corollary: "MUST NOT hold the lock across teardown (seconds-to-minutes). Lock the state transition only."
    story_deviation: "Recorded - story Technical Notes names the wrong lock."

  R5B_redundant_revoke:
    ruling: "Drop the separate revokeAndVerify call. teardownSandbox already performs it."
    reasoning: >
      Story mandates it AND contradicts itself on its position (:97-98 vs :303-304). A redundant
      call converts a provider-list hiccup into a hard failure of an already-successful pause.
      teardown.ts has 4 claimants and DF3.4 is not one - consume as-is, zero edits.
    story_deviation: recorded

  R5C_key_unattributable:
    ruling: "Copy DF3.1's refusal posture. Never print 'paused cleanly' over a possibly-live key."
    reasoning: "Box present + no keyHash + record open. DF3.1 already fixed this for `fleet teardown`."

  D5_ack_read_transport:
    ruling: "Use driver.exec(vm, ['sh','-c', `cat ${shellQuote(path)}`]) to read the ack. NOT driver.copyFile."
    severity: BLOCKER-in-story-text
    reasoning: >
      Story AC6 (:148-149) and Technical Notes (:231) both mandate
      driver.copyFile(vm, "/run/steering/acks.ndjson", <host tmp>). copyFile REFUSES ABSOLUTE
      PATHS on BOTH drivers. This exact bug already burned fan-out in production - see
      fanout-primitive.ts:688-696, dated live measurement fan-20260826-f04c3c: "a copyFile read
      died 'remote-path-invalid' on every tick and the race spun to its ceiling". The repo's own
      adopted fix is exec+cat. Both attach legs become exec: append = exec+stdin, ack = exec+cat.
      No driver path-safety surface changes. One-verb spec correction, not a path relocation.
    story_deviation: recorded
    companion: >
      Need steeringRoot() / QDS_STEERING_ROOT override mirroring runMarkerRoot() (journal.ts:33-40)
      so the fake-box test can run: /run is root-owned on Linux and absent on darwin.

  D6_ack_placement:
    ruling: "Ack at DRAIN time (or in a finally), NOT at the :429 accepted-path seam."
    reasoning: >
      The :429 seam sits after every early return - degraded :338, render fail :354, call fail
      :369, malformed :386, schema reject :393, allowlist/roster :401/:410/:419 - all of which
      return PROCEED without reaching it. A message that WAS drained and folded into prompt
      context would go un-acked and attach would wrongly report attach-not-acked.
      Story AC6 defines the ack as the message "appear[ing] in that solicitation's prompt
