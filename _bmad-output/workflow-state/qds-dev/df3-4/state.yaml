    steering.ts:429-430 = "SEAM DF3.4: ack the reply into the inbox record here."
    Do NOT move or reword either comment - they are the anchors named in all three stories.
  one_shared_path: >
    The three points are three CALL SITES in scripts/pipeline-run.ts but ONE implementation:
    solicitSerialized (steering.ts:335-432). A single `await drainInbox(point, ctx)` at :342
    serves all three. Copies are structurally impossible.
  port_not_import: >
    steering.ts must not import fleet/provider code (:12-13). Add ONE OPTIONAL dep to
    createSteering(deps) as a PORT:
    inbox?: { drain(point): Promise<{messageId,message}[]>; ack(messageId, point): Promise<void> }
    Additive object field - DF3.6 adds its bounds deps to the same object.
  fold_site: >
    renderPrompt (:197-205) joins ctx.promptContext with "\n"; truncation is HEAD-first so
    newest-last is the invariant (:170-176). Drained lines MUST be push()ed, never unshift()ed.
    Mirror pipeline-run.ts:1016-1018's accepted-guidance push. sanitizeForMessage is MANDATORY -
    an attach message is unsanitized operator text and a newline forges an instruction line.
  concurrency: "No extra guard needed - :328-333 chains every solicit; a drain awaiting I/O inside solicitSerialized inherits that serialization. But it extends the critical section by a driver round-trip, so bound it."
  inv_approve_5: >
    ALREADY STRUCTURALLY GUARANTEED by DIRECTION, not by the allowlist: prompt context is INPUT,
    a directive is OUTPUT. parseReply (:231-241) only ever sees reply.raw from deps.caller.call().
    A drained line is never parsed. DF3.4 ADDS NOTHING - it must only avoid BREAKING it:
    never pass a drained line to SteeringDirectiveSchema.safeParse, no new union member, no
    widening of ResidentTripwire.cause.
  mode_0600_idiom: >
    Reference is credentials.ts:347-358 deliverScript: `umask 077 && mkdir -p "$(dirname ...)" &&
    cat > ... && chmod 600 ... && python3 -c '<stat read-back>'`. umask FIRST (0600 from creation,
    never briefly world-readable); mkdir -p is how /run/steering/ gets created; payload on stdin
    with argv carrying only the fixed script; mode CONFIRMED by reading stat back
    (deliverRunKey :380-393 hard-refuses on mode !== "600"). python3 not `stat -c` because the
    fake driver runs on the host and BSD stat has no -c.
  negative_control_reuse: >
    FakeDriver records NEITHER argv nor stdin. Use tests/providers/fixtures/recording-driver.ts:55-59:
    `this.execCalls.push({ vm, argv: [...argv], hadStdin: stdin !== undefined })` - argv copied,
    stdin recorded as a BOOLEAN ONLY, deliberately, "so the fixture itself cannot leak a secret
    into a test artifact". AC6 negative control = wrap a live FakeDriver in RecordingDriver,
    assert no payload token in any execCalls[i].argv and hadStdin === true.
    Reuse it; do NOT write a second recorder.
  ndjson_reuse: >
    Canonical append/read pair is src/reverify/report.ts:291-323 - appendFileSync(..., {mode:0o600}),
    reader SKIPS torn lines (exactly what a `cat >>` killed mid-append produces). Second precedent
    src/pr/push.ts:138/151. journal.ts is NOT NDJSON (temp+fsync+rename of one doc) - do not model
    on it. No existing dedupe helper; messageId dedupe is DF3.4-new (Set<string>, run-lifetime).
  polling_reuse: >
    withTimeout src/providers/timeout.ts:46-57 (per-call deadline; abandons, does not cancel).
    runRace fanout-primitive.ts:602-660 is the poll-to-ceiling shape with three SEPARATE injectable
    constants (:51-57) and an injected monotonic clock; re-checks the ceiling BEFORE sleeping.
    FakeDriver's exec has NO timeout of its own, so wrapping the ack read in withTimeout is
    MANDATORY. Steal MARKER_UNUSABLE_TICKS_LIMIT=3 - a present-but-unparseable target is abandoned,
    not polled to the ceiling ("persistent parse failure is CORRUPTION, not latency"). A torn ack
    line deserves the same.
  df36_rebase_surface: >
    Put the drain in ONE named function called from exactly one place directly UNDER the DF3.6
    seam comment, so DF3.6 inserts one `if` ABOVE it. DF3.6 gates BEFORE the prompt renders.

