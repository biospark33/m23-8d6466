lazy_expiry_conflict:
  problem: >
    AC7 says "Expiry is swept in the same pass (AC3)". But `fleet status` builds a READ-ONLY store
    when --dir is given (fleet.ts:2212, `create: dir === undefined`) and a create:false store
    THROWS on every write (run-record.ts:857-871). A PERSISTING sweep cannot run in status on that
    path. Making status writable reintroduces the round-11 chmod-0700 regression.
  ruling: >
    Split the sweep. DERIVE expiry VIRTUALLY in status (pure read, no write - a run past expiresAt
    displays as timed-out), and PERSIST it authoritatively in approve/reject, which already hold
    writable stores AND the approval lock. This satisfies AC3's "expiry is evaluated lazily on
    every fleet invocation - no daemon - and BEFORE that invocation's own decision, so a decision
    arriving after expiresAt finds timed-out and is refused", because the decision path is exactly
    where the write is both possible and needed.
  story_deviation: recorded
    R4b-gating-checks:      { status: complete, file: research/R8-gating-checks.md }

ac1c_resume_cleared:   # R8 Q1 - the last thing gating AC1(c)
  verdict: "captureSpend IS SAFE TO RE-RUN. DF3.4 adds NO guard. Double-counting is structurally impossible."
  certainty: "CERTAIN, not probable - asked for and delivered."
  evidence:
    no_ledger_path: >
      captureSpend NEVER touches the cost ledger. Its only write is
      deps.store.set(runId, { spendMicroUsd }) - an idempotent scalar OVERWRITE, not an additive
      row. CredentialDeps is {keyApi, driver, store, requestId} - there is no ledger reference to
      double-count through. Explicit design decision at cost-ledger.ts:1010-1013: "Never from
      captureSpend: that reads the same token money DF2.7 already priced, and ingesting it would
      double-count inside the SUM the gate reads." Pinned by a test whose NAME is the invariant
      (cost-ledger.test.ts:626): "the issue SUM equals token rows plus exactly one box row -
      captureSpend money appears nowhere".
    already_revoked_key: >
      DEGRADES, does not throw. entry === null (absent from a fully-enumerated list = the
      post-revoke state) returns rec.spendMicroUsd ?? 0 and WRITES NOTHING - recording 0 "would be
      an authoritative-looking lie". Pinned at credentials.test.ts:628-637 with exactly the
      assertion AC1(c) needs: expect(store.get(runId).spendMicroUsd).toBeUndefined().
      A second capture cannot overwrite the first capture's figure.
    only_throw_path: "`truncated` (unenumerable key list) - a transient provider fault that throws identically on a FIRST run, not a re-run artifact. Fail-closed by design."
    step_placement: >
      teardown.ts:387-401 via runStep, NOT runBoxStep - so OUTSIDE the box-gone-skip guard (which
      applies only to steps 2 artifacts and 3 harvest, teardown.ts:141-148). Correct, not a gap:
      captureSpend makes no box calls at all (teardown.ts:380-381 - "driver rides along for the
      interface's shape"). A dead box cannot fail step 1.
  two_boundary_conditions_to_STATE_in_the_story_not_code_around:
    - "An unenumerable key list aborts the resume PRE-revoke. Retryable and correct."
    - "A re-run leaves the FIRST successful capture in the record, not a fresher one. Desired semantics - but 're-running teardown refreshes spend' is the intuitive-and-WRONG reading, so say it explicitly."

