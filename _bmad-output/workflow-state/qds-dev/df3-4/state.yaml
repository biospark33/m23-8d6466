  seams_prewritten_by_df33: >
    DF3.3 pre-wrote BOTH seam comments. AC6 is pure INSERTION - zero edits to DF3.3-owned lines.
    steering.ts:339-342 = "SEAM DF3.4: drain the resident inbox into ctx.promptContext here,
