    string|int|ports(int[]) and ExtensionEntry values are string|number.
  HIGH_D2_bundlepath_assertnosecret: >
    [ANSWERED - see decisions.D2_bundlePath FINAL_RULING: do NOT store it at all, no field and
    no exemption. Validated by existence instead.]
